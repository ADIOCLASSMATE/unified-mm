<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" font-family="WenQuanYi Zen Hei">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#182230" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#667085"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#4C6FFF"/></marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#7A5AF8"/></marker>
    <style>
      text{font-family:'WenQuanYi Zen Hei','Droid Sans Fallback',sans-serif}.title{font-size:34px;font-weight:700;fill:#101828}.subtitle{font-size:19px;font-weight:400;fill:#667085}.stage{font-size:19px;font-weight:700;fill:#344054}.boxTitle{font-size:22px;font-weight:700;fill:#101828}.boxText{font-size:18px;font-weight:400;fill:#475467}.small{font-size:16px;font-weight:400;fill:#667085}.chip{font-size:16px;font-weight:600}.num{font-size:20px;font-weight:700;fill:white}.arrow{fill:none;stroke:#667085;stroke-width:3;marker-end:url(#arrow)}.arrowBlue{fill:none;stroke:#4C6FFF;stroke-width:4;marker-end:url(#arrowBlue)}.arrowPurple{fill:none;stroke:#7A5AF8;stroke-width:4;marker-end:url(#arrowPurple)}
    </style>
  </defs>
  <rect width="1600" height="1200" fill="#F7F9FC"/>
  <text x="64" y="62" class="title">训练时一次 Forward 的数据流</text>
  <text x="64" y="98" class="subtitle">训练双流并行预测：文本位置优化 CE，图像位置优化 flow-matching MSE</text>

  <circle cx="82" cy="160" r="24" fill="#344054"/><text x="82" y="168" text-anchor="middle" class="num">1</text>
  <text x="122" y="168" class="stage">准备样本与任务序列</text>
  <rect x="62" y="196" width="446" height="176" rx="24" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2" filter="url(#shadow)"/>
  <text x="92" y="238" class="boxTitle">ImageNet 样本</text>
  <text x="92" y="277" class="boxText">图像 → 读取缓存 posterior mean / std</text>
  <text x="92" y="313" class="boxText">采样 KL16 latent：256 × 16 维</text>
  <rect x="92" y="330" width="170" height="26" rx="13" fill="#F4EBFF"/>
  <text x="177" y="349" text-anchor="middle" class="chip" fill="#6941C6">无需在线运行 VAE</text>

  <rect x="570" y="196" width="488" height="176" rx="24" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="238" class="boxTitle">序列化任务</text>
  <rect x="600" y="264" width="126" height="34" rx="17" fill="#EAF0FF"/><text x="663" y="287" text-anchor="middle" class="chip" fill="#3154CC">Class → Image</text>
  <rect x="738" y="264" width="126" height="34" rx="17" fill="#EAF0FF"/><text x="801" y="287" text-anchor="middle" class="chip" fill="#3154CC">Text → Image</text>
  <rect x="876" y="264" width="126" height="34" rx="17" fill="#ECFDF3"/><text x="939" y="287" text-anchor="middle" class="chip" fill="#027A48">Image → Text</text>
  <text x="600" y="335" class="boxText">[prefix] [BOI] [256 latent] [EOI] [suffix]</text>

  <rect x="1120" y="196" width="418" height="176" rx="24" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="238" class="boxTitle">监督与位置信息</text>
  <text x="1150" y="276" class="boxText">token types · labels · loss mask</text>
  <text x="1150" y="312" class="boxText">2D position · segment · σ 顺序</text>
  <rect x="1150" y="330" width="240" height="26" rx="13" fill="#FFF7E6"/>
  <text x="1270" y="349" text-anchor="middle" class="chip" fill="#B54708">文本有序，图像可随机有序</text>

  <path d="M508 284 L570 284" class="arrow"/><path d="M1058 284 L1120 284" class="arrow"/>

  <circle cx="82" cy="444" r="24" fill="#344054"/><text x="82" y="452" text-anchor="middle" class="num">2</text>
  <text x="122" y="452" class="stage">构造严格无对角线的双流输入</text>

  <rect x="62" y="484" width="432" height="160" rx="24" fill="#FFF7E6" stroke="#FEC84B" stroke-width="2" filter="url(#shadow)"/>
  <text x="278" y="526" text-anchor="middle" class="boxTitle">Attention graph</text>
  <text x="278" y="566" text-anchor="middle" class="boxText">仅允许 key 的 σⱼ &lt; query 的 σᵢ</text>
  <line x1="118" y1="594" x2="438" y2="594" stroke="#FEC84B" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="278" y="626" text-anchor="middle" class="small">对角线始终移除；segment packing 再限制跨样本边</text>

  <rect x="554" y="484" width="432" height="160" rx="24" fill="#ECFDF3" stroke="#6CE9A6" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="598" cy="526" r="19" fill="#12B76A"/><text x="598" y="533" text-anchor="middle" class="chip" fill="#FFFFFF">X0</text>
  <text x="630" y="534" class="boxTitle">Content stream</text>
  <text x="586" y="577" class="boxText">真实文本 embedding</text>
  <text x="586" y="614" class="boxText">真实 latent projection + 小输入噪声</text>

  <rect x="1046" y="484" width="492" height="160" rx="24" fill="#FFF7E6" stroke="#FEC84B" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1090" cy="526" r="19" fill="#F79009"/><text x="1090" y="533" text-anchor="middle" class="chip" fill="#FFFFFF">XT</text>
  <text x="1122" y="534" class="boxTitle">Query stream</text>
  <text x="1078" y="577" class="boxText">待预测文本 → text-mask embedding</text>
  <text x="1078" y="614" class="boxText">待预测图像 → image-mask embedding</text>

  <path d="M1329 372 C1329 420 278 420 278 484" class="arrow"/>
  <path d="M494 564 L554 564" class="arrow"/><path d="M494 596 C770 704 1000 704 1046 596" class="arrow"/>

  <circle cx="82" cy="720" r="24" fill="#4C6FFF"/><text x="82" y="728" text-anchor="middle" class="num">3</text>
  <text x="122" y="728" class="stage">共享 Backbone 统一建模</text>
  <rect x="474" y="696" width="652" height="174" rx="28" fill="#FFFFFF" stroke="#84ADFF" stroke-width="3" filter="url(#shadow)"/>
  <text x="800" y="742" text-anchor="middle" class="boxTitle">28 层无对角线双流 Qwen</text>
  <text x="800" y="784" text-anchor="middle" class="boxText">X0 与 XT 都产生 Query；K / V 只来自 X0；共享严格 σ mask</text>
  <rect x="566" y="814" width="468" height="34" rx="17" fill="#EAF0FF"/>
  <text x="800" y="837" text-anchor="middle" class="chip" fill="#3154CC">最终读取 XT hidden：每个位置直接预测 xᵢ 本身</text>
  <path d="M770 644 L770 696" class="arrowBlue"/><path d="M1292 644 C1292 676 1032 676 1032 696" class="arrowBlue"/>

  <circle cx="82" cy="932" r="24" fill="#7A5AF8"/><text x="82" y="940" text-anchor="middle" class="num">4</text>
  <text x="122" y="940" class="stage">按模态分头计算目标</text>

  <rect x="62" y="974" width="570" height="154" rx="24" fill="#FFFFFF" stroke="#B2CCFF" stroke-width="2" filter="url(#shadow)"/>
  <text x="92" y="1016" class="boxTitle">文本位置</text>
  <rect x="92" y="1038" width="172" height="50" rx="14" fill="#EAF0FF"/>
  <text x="178" y="1070" text-anchor="middle" class="boxText">共享 LM Head</text>
  <path d="M264 1063 L334 1063" class="arrowBlue"/>
  <rect x="340" y="1038" width="248" height="50" rx="14" fill="#EAF0FF"/>
  <text x="464" y="1070" text-anchor="middle" class="boxText">CE：预测同位置 token</text>

  <rect x="690" y="930" width="848" height="198" rx="24" fill="#FFFFFF" stroke="#D6BBFB" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="972" class="boxTitle">图像位置</text>
  <rect x="720" y="996" width="178" height="52" rx="14" fill="#F4EBFF"/><text x="809" y="1029" text-anchor="middle" class="boxText">Hidden → zᵢ</text>
  <rect x="720" y="1060" width="178" height="50" rx="14" fill="#F9F5FF"/><text x="809" y="1092" text-anchor="middle" class="small">xᵢ, εᵢ, tᵢ → xₜ,ᵢ</text>
  <path d="M898 1022 L962 1022" class="arrowPurple"/><path d="M898 1085 C930 1085 930 1052 962 1052" class="arrowPurple"/>
  <rect x="968" y="996" width="276" height="90" rx="16" fill="#F4EBFF"/>
  <text x="1106" y="1032" text-anchor="middle" class="boxText">Contextual flow head</text>
  <text x="1106" y="1063" text-anchor="middle" class="small">读取已 reveal latent context</text>
  <path d="M1244 1041 L1290 1041" class="arrowPurple"/>
  <rect x="1296" y="996" width="210" height="90" rx="16" fill="#F4EBFF"/>
  <text x="1401" y="1032" text-anchor="middle" class="boxText">Velocity MSE</text>
  <text x="1401" y="1063" text-anchor="middle" class="small">目标：xᵢ − εᵢ</text>

  <path d="M676 870 C676 904 347 904 347 974" class="arrowBlue"/>
  <path d="M924 870 C924 900 1114 900 1114 930" class="arrowPurple"/>

  <rect x="464" y="1148" width="672" height="40" rx="20" fill="#344054"/>
  <text x="800" y="1175" text-anchor="middle" class="chip" fill="#FFFFFF">总损失 = λ_text · L_text + λ_image · L_image</text>
  <path d="M347 1128 C347 1143 464 1143 464 1168" class="arrow"/><path d="M1114 1128 C1114 1143 1136 1143 1136 1168" class="arrow"/>
</svg>
