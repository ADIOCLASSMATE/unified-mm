<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" font-family="WenQuanYi Zen Hei">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#182230" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#667085"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#4C6FFF"/></marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#7A5AF8"/></marker>
    <style>
      text{font-family:'WenQuanYi Zen Hei','Droid Sans Fallback',sans-serif}.title{font-size:34px;font-weight:700;fill:#101828}.subtitle{font-size:19px;font-weight:400;fill:#667085}.stage{font-size:19px;font-weight:700;fill:#344054}.boxTitle{font-size:22px;font-weight:700;fill:#101828}.boxText{font-size:18px;font-weight:400;fill:#475467}.small{font-size:16px;font-weight:400;fill:#667085}.chip{font-size:16px;font-weight:600}.num{font-size:19px;font-weight:700;fill:white}.arrow{fill:none;stroke:#667085;stroke-width:3;marker-end:url(#arrow)}.arrowBlue{fill:none;stroke:#4C6FFF;stroke-width:4;marker-end:url(#arrowBlue)}.arrowPurple{fill:none;stroke:#7A5AF8;stroke-width:4;marker-end:url(#arrowPurple)}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#F7F9FC"/>
  <text x="64" y="62" class="title">图像生成：外层 Reveal × 内层 Flow ODE</text>
  <text x="64" y="98" class="subtitle">外层决定“先生成哪个 patch”，内层负责“把该 patch 从噪声解到数据”</text>

  <rect x="54" y="150" width="330" height="730" rx="28" fill="#FFFFFF" stroke="#B2CCFF" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="94" cy="194" r="22" fill="#4C6FFF"/><text x="94" y="201" text-anchor="middle" class="num">1</text>
  <text x="132" y="202" class="boxTitle">初始化统一序列</text>
  <rect x="84" y="238" width="270" height="54" rx="14" fill="#EAF0FF"/>
  <text x="219" y="272" text-anchor="middle" class="boxText">文本 Prompt + BOI</text>
  <text x="219" y="328" text-anchor="middle" class="boxText">预留 16×16 latent 网格</text>

  <g transform="translate(93,356)">
    <rect x="0" y="0" width="246" height="246" rx="16" fill="#F2F4F7" stroke="#98A2B3" stroke-width="2"/>
    <g fill="#D0D5DD">
      <rect x="12" y="12" width="22" height="22" rx="4"/><rect x="40" y="12" width="22" height="22" rx="4"/><rect x="68" y="12" width="22" height="22" rx="4"/><rect x="96" y="12" width="22" height="22" rx="4"/><rect x="124" y="12" width="22" height="22" rx="4"/><rect x="152" y="12" width="22" height="22" rx="4"/><rect x="180" y="12" width="22" height="22" rx="4"/><rect x="208" y="12" width="22" height="22" rx="4"/>
      <rect x="12" y="40" width="22" height="22" rx="4"/><rect x="40" y="40" width="22" height="22" rx="4"/><rect x="68" y="40" width="22" height="22" rx="4"/><rect x="96" y="40" width="22" height="22" rx="4"/><rect x="124" y="40" width="22" height="22" rx="4"/><rect x="152" y="40" width="22" height="22" rx="4"/><rect x="180" y="40" width="22" height="22" rx="4"/><rect x="208" y="40" width="22" height="22" rx="4"/>
      <rect x="12" y="68" width="22" height="22" rx="4"/><rect x="40" y="68" width="22" height="22" rx="4"/><rect x="68" y="68" width="22" height="22" rx="4"/><rect x="96" y="68" width="22" height="22" rx="4"/><rect x="124" y="68" width="22" height="22" rx="4"/><rect x="152" y="68" width="22" height="22" rx="4"/><rect x="180" y="68" width="22" height="22" rx="4"/><rect x="208" y="68" width="22" height="22" rx="4"/>
      <rect x="12" y="96" width="22" height="22" rx="4"/><rect x="40" y="96" width="22" height="22" rx="4"/><rect x="68" y="96" width="22" height="22" rx="4"/><rect x="96" y="96" width="22" height="22" rx="4"/><rect x="124" y="96" width="22" height="22" rx="4"/><rect x="152" y="96" width="22" height="22" rx="4"/><rect x="180" y="96" width="22" height="22" rx="4"/><rect x="208" y="96" width="22" height="22" rx="4"/>
      <rect x="12" y="124" width="22" height="22" rx="4"/><rect x="40" y="124" width="22" height="22" rx="4"/><rect x="68" y="124" width="22" height="22" rx="4"/><rect x="96" y="124" width="22" height="22" rx="4"/><rect x="124" y="124" width="22" height="22" rx="4"/><rect x="152" y="124" width="22" height="22" rx="4"/><rect x="180" y="124" width="22" height="22" rx="4"/><rect x="208" y="124" width="22" height="22" rx="4"/>
      <rect x="12" y="152" width="22" height="22" rx="4"/><rect x="40" y="152" width="22" height="22" rx="4"/><rect x="68" y="152" width="22" height="22" rx="4"/><rect x="96" y="152" width="22" height="22" rx="4"/><rect x="124" y="152" width="22" height="22" rx="4"/><rect x="152" y="152" width="22" height="22" rx="4"/><rect x="180" y="152" width="22" height="22" rx="4"/><rect x="208" y="152" width="22" height="22" rx="4"/>
      <rect x="12" y="180" width="22" height="22" rx="4"/><rect x="40" y="180" width="22" height="22" rx="4"/><rect x="68" y="180" width="22" height="22" rx="4"/><rect x="96" y="180" width="22" height="22" rx="4"/><rect x="124" y="180" width="22" height="22" rx="4"/><rect x="152" y="180" width="22" height="22" rx="4"/><rect x="180" y="180" width="22" height="22" rx="4"/><rect x="208" y="180" width="22" height="22" rx="4"/>
      <rect x="12" y="208" width="22" height="22" rx="4"/><rect x="40" y="208" width="22" height="22" rx="4"/><rect x="68" y="208" width="22" height="22" rx="4"/><rect x="96" y="208" width="22" height="22" rx="4"/><rect x="124" y="208" width="22" height="22" rx="4"/><rect x="152" y="208" width="22" height="22" rx="4"/><rect x="180" y="208" width="22" height="22" rx="4"/><rect x="208" y="208" width="22" height="22" rx="4"/>
    </g>
    <rect x="96" y="68" width="22" height="22" rx="4" fill="#4C6FFF"/>
    <rect x="180" y="124" width="22" height="22" rx="4" fill="#7A5AF8"/>
    <rect x="40" y="180" width="22" height="22" rx="4" fill="#12B76A"/>
  </g>
  <text x="219" y="634" text-anchor="middle" class="small">灰色 = mask；彩色 = 已 reveal</text>
  <rect x="84" y="674" width="270" height="76" rx="16" fill="#FFF7E6"/>
  <text x="219" y="706" text-anchor="middle" class="boxText">默认位置策略</text>
  <text x="219" y="734" text-anchor="middle" class="chip" fill="#B54708">spatial_halton</text>
  <text x="219" y="810" text-anchor="middle" class="small">也支持 random / sequential 等</text>

  <rect x="442" y="150" width="658" height="730" rx="28" fill="#FFFFFF" stroke="#84ADFF" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="484" cy="194" r="22" fill="#4C6FFF"/><text x="484" y="201" text-anchor="middle" class="num">2</text>
  <text x="522" y="202" class="boxTitle">外层：逐个 Reveal 256 个 latent token</text>

  <rect x="486" y="242" width="570" height="92" rx="18" fill="#EAF0FF"/>
  <text x="771" y="278" text-anchor="middle" class="boxTitle">选择下一个位置 i</text>
  <text x="771" y="308" text-anchor="middle" class="small">位置顺序由 σ / reveal policy 决定</text>
  <path d="M771 334 L771 374" class="arrowBlue"/>
  <rect x="486" y="380" width="570" height="126" rx="18" fill="#ECFDF3"/>
  <text x="771" y="418" text-anchor="middle" class="boxTitle">X0 单流 Qwen</text>
  <text x="771" y="454" text-anchor="middle" class="boxText">读取文本 + 已 reveal latent 的 KV cache</text>
  <text x="771" y="486" text-anchor="middle" class="small">当前位置仍是 mask，且不能看到自身</text>
  <path d="M771 506 L771 546" class="arrowBlue"/>
  <rect x="486" y="552" width="570" height="102" rx="18" fill="#EAF0FF"/>
  <text x="771" y="591" text-anchor="middle" class="boxTitle">得到语义 condition zᵢ</text>
  <text x="771" y="625" text-anchor="middle" class="boxText">Backbone 只负责“当前 patch 应该是什么”</text>
  <path d="M771 654 L771 694" class="arrowPurple"/>
  <rect x="486" y="700" width="570" height="112" rx="18" fill="#F4EBFF"/>
  <text x="771" y="740" text-anchor="middle" class="boxTitle">调用内层 Flow 解码当前 patch</text>
  <text x="771" y="775" text-anchor="middle" class="boxText">返回 xᵢ，写回序列与两级 cache</text>
  <path d="M526 812 C456 846 456 288 486 288" fill="none" stroke="#4C6FFF" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrowBlue)"/>
  <rect x="582" y="828" width="378" height="32" rx="16" fill="#EAF0FF"/>
  <text x="771" y="850" text-anchor="middle" class="chip" fill="#3154CC">未完成 → 回到位置选择；共循环 256 次</text>

  <rect x="1158" y="150" width="388" height="730" rx="28" fill="#FFFFFF" stroke="#D6BBFB" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1200" cy="194" r="22" fill="#7A5AF8"/><text x="1200" y="201" text-anchor="middle" class="num">3</text>
  <text x="1238" y="202" class="boxTitle">内层：Flow ODE</text>
  <text x="1352" y="236" text-anchor="middle" class="small">只解码当前一个 16 维 latent</text>
  <circle cx="1352" cy="302" r="58" fill="#F2F4F7" stroke="#98A2B3" stroke-width="2"/>
  <text x="1352" y="296" text-anchor="middle" class="boxTitle">εᵢ</text>
  <text x="1352" y="326" text-anchor="middle" class="small">高斯噪声</text>
  <path d="M1352 360 L1352 402" class="arrowPurple"/>
  <rect x="1210" y="408" width="284" height="168" rx="22" fill="#F4EBFF"/>
  <text x="1352" y="448" text-anchor="middle" class="boxTitle">10-step Heun</text>
  <text x="1352" y="484" text-anchor="middle" class="boxText">t = 0 → 1</text>
  <text x="1352" y="520" text-anchor="middle" class="small">CFG = 3.5</text>
  <text x="1352" y="550" text-anchor="middle" class="small">condition：zᵢ + 已生成 latent cache</text>
  <path d="M1352 576 L1352 620" class="arrowPurple"/>
  <circle cx="1352" cy="678" r="58" fill="#F4EBFF" stroke="#7A5AF8" stroke-width="3"/>
  <text x="1352" y="672" text-anchor="middle" class="boxTitle">xᵢ</text>
  <text x="1352" y="702" text-anchor="middle" class="small">生成 patch</text>
  <path d="M1294 678 C1188 678 1134 756 1056 756" class="arrowPurple"/>
  <rect x="1210" y="768" width="284" height="70" rx="18" fill="#ECFDF3"/>
  <text x="1352" y="798" text-anchor="middle" class="boxText">Flow content cache</text>
  <text x="1352" y="825" text-anchor="middle" class="small">让后续 patch 看到已生成 latent</text>

  <path d="M384 512 L442 512" class="arrowBlue"/><path d="M1100 603 L1158 603" class="arrowPurple"/>

  <rect x="352" y="928" width="896" height="82" rx="24" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2" filter="url(#shadow)"/>
  <text x="394" y="961" class="boxTitle">全部完成</text>
  <text x="394" y="992" class="boxText">256 latent → reshape 为 16×16×16 → KL16 VAE Decoder → 256×256 RGB 图像</text>
  <path d="M771 880 L771 928" class="arrow"/>
  <rect x="1282" y="920" width="264" height="96" rx="18" fill="#F4EBFF" stroke="#D6BBFB" stroke-width="2"/>
  <path d="M1300 996 L1360 944 L1402 979 L1434 951 L1528 996 Z" fill="#9E77ED" opacity="0.72"/>
  <circle cx="1488" cy="952" r="14" fill="#FDB022"/>
</svg>
