<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">Selfless-Flow E2 row-column two-dimensional RoPE architecture</title>
  <desc id="desc">Comparison between the flattened one-dimensional RoPE baseline and E2, which separates observed content from additive position and applies interleaved row-column RoPE to image queries and keys.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fc; }
      .panel { fill: #ffffff; stroke: #d9deea; stroke-width: 2; }
      .title { font: 700 34px Inter, "Noto Sans SC", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 17px Inter, "Noto Sans SC", Arial, sans-serif; fill: #5b6475; }
      .h2 { font: 700 23px Inter, "Noto Sans SC", Arial, sans-serif; fill: #172033; }
      .h3 { font: 700 18px Inter, "Noto Sans SC", Arial, sans-serif; fill: #263247; }
      .body { font: 400 16px Inter, "Noto Sans SC", Arial, sans-serif; fill: #333c4f; }
      .small { font: 400 13px Inter, "Noto Sans SC", Arial, sans-serif; fill: #5b6475; }
      .mono { font: 600 14px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #263247; }
      .mono-small { font: 600 12px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #263247; }
      .baseline { fill: #fff4f0; stroke: #db8d75; stroke-width: 1.5; }
      .e2 { fill: #eefbf5; stroke: #58a881; stroke-width: 1.5; }
      .query { fill: #eef2ff; stroke: #7c8fe8; stroke-width: 1.5; }
      .content { fill: #f8fbff; stroke: #8ba7c9; stroke-width: 1.5; }
      .neutral { fill: #f7f8fb; stroke: #aab3c3; stroke-width: 1.4; }
      .row { fill: #1f9d8b; }
      .col { fill: #e97855; }
      .axisText { font: 700 15px Inter, Arial, sans-serif; fill: white; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #657086; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #9aa4b7; stroke-width: 1.7; fill: none; marker-end: url(#arrowSoft); }
      .bad { fill: #b44937; }
      .good { fill: #237a57; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#657086"/>
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b7"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect class="bg" width="1440" height="940"/>
  <text class="title" x="44" y="58">Selfless-Flow E2：把二维位置放回 attention geometry</text>
  <text class="subtitle" x="44" y="88">Observed latent 保留纯内容，query 保留绝对身份，image Q/K 使用 row/column factorized 2D RoPE</text>

  <rect class="panel" x="40" y="116" width="650" height="322" rx="20" filter="url(#shadow)"/>
  <text class="h2" x="70" y="157">Baseline：内容、绝对位置、相对关系混在一起</text>
  <g transform="translate(70,184)">
    <rect class="content" x="0" y="0" width="185" height="70" rx="12"/>
    <text class="h3" x="92" y="28" text-anchor="middle">observed X0</text>
    <text class="mono" x="92" y="53" text-anchor="middle">Wz + b + Pxy</text>
    <rect class="query" x="0" y="90" width="185" height="70" rx="12"/>
    <text class="h3" x="92" y="118" text-anchor="middle">masked query</text>
    <text class="mono" x="92" y="143" text-anchor="middle">emask + Pxy</text>
    <path class="arrow" d="M197,80 L264,80"/>
    <rect class="baseline" x="276" y="32" width="246" height="96" rx="14"/>
    <text class="h3" x="399" y="62" text-anchor="middle">flattened 1D Qwen RoPE</text>
    <text class="mono" x="399" y="88" text-anchor="middle">p = a + 16r + c</text>
    <text class="small" x="399" y="112" text-anchor="middle">row/column 邻接尺度不对称</text>
  </g>
  <g transform="translate(70,365)">
    <text class="small" x="0" y="0">水平邻居 Δp=1；垂直邻居 Δp=16；observed value path 被 additive Pxy 改写。</text>
  </g>

  <rect class="panel" x="716" y="116" width="684" height="322" rx="20" filter="url(#shadow)"/>
  <text class="h2" x="746" y="157">E2：三条信息路径各司其职</text>
  <g transform="translate(746,184)">
    <rect class="content" x="0" y="0" width="190" height="70" rx="12"/>
    <text class="h3" x="95" y="28" text-anchor="middle">observed X0</text>
    <text class="mono" x="95" y="53" text-anchor="middle">Wz + b</text>
    <rect class="query" x="0" y="90" width="190" height="70" rx="12"/>
    <text class="h3" x="95" y="118" text-anchor="middle">masked query</text>
    <text class="mono" x="95" y="143" text-anchor="middle">emask + Pxy</text>
    <path class="arrow" d="M202,80 L258,80"/>
    <rect class="e2" x="270" y="18" width="318" height="124" rx="14"/>
    <text class="h3" x="429" y="47" text-anchor="middle">row/column 2D RoPE on Q/K</text>
    <text class="mono" x="429" y="75" text-anchor="middle">(prow,pcol)=(a+r,a+c)</text>
    <text class="small" x="429" y="101" text-anchor="middle">QX0、QXT、KX0 旋转</text>
    <text class="small" x="429" y="124" text-anchor="middle">V、residual hidden 不旋转</text>
  </g>
  <g transform="translate(746,365)">
    <text class="small" x="0" y="0">Pxy 回答“我要预测哪里”；2D RoPE 回答“我与可见上下文的二维关系是什么”。</text>
  </g>

  <rect class="panel" x="40" y="466" width="1360" height="278" rx="20" filter="url(#shadow)"/>
  <text class="h2" x="70" y="507">E2 的 mixed-sequence 坐标与频率分配</text>
  <g transform="translate(70,532)">
    <rect class="neutral" x="0" y="0" width="110" height="60" rx="10"/>
    <text class="mono-small" x="55" y="25" text-anchor="middle">text p</text>
    <text class="mono-small" x="55" y="46" text-anchor="middle">(p,p)</text>
    <rect class="neutral" x="120" y="0" width="110" height="60" rx="10"/>
    <text class="mono-small" x="175" y="25" text-anchor="middle">special</text>
    <text class="mono-small" x="175" y="46" text-anchor="middle">(p+1,p+1)</text>
    <path class="soft-arrow" d="M240,30 L286,30"/>
    <text class="small" x="263" y="19" text-anchor="middle">anchor a</text>

    <g transform="translate(300,0)">
      <rect class="e2" x="0" y="0" width="118" height="60" rx="8"/>
      <rect class="e2" x="122" y="0" width="118" height="60" rx="8"/>
      <rect class="e2" x="244" y="0" width="118" height="60" rx="8"/>
      <rect class="e2" x="0" y="64" width="118" height="60" rx="8"/>
      <rect class="e2" x="122" y="64" width="118" height="60" rx="8"/>
      <rect class="e2" x="244" y="64" width="118" height="60" rx="8"/>
      <rect class="e2" x="0" y="128" width="118" height="60" rx="8"/>
      <rect class="e2" x="122" y="128" width="118" height="60" rx="8"/>
      <rect class="e2" x="244" y="128" width="118" height="60" rx="8"/>
      <text class="mono-small" x="59" y="35" text-anchor="middle">(a+0,a+0)</text>
      <text class="mono-small" x="181" y="35" text-anchor="middle">(a+0,a+1)</text>
      <text class="mono-small" x="303" y="35" text-anchor="middle">(a+0,a+2)</text>
      <text class="mono-small" x="59" y="99" text-anchor="middle">(a+1,a+0)</text>
      <text class="mono-small" x="181" y="99" text-anchor="middle">(a+1,a+1)</text>
      <text class="mono-small" x="303" y="99" text-anchor="middle">(a+1,a+2)</text>
      <text class="mono-small" x="59" y="163" text-anchor="middle">(a+2,a+0)</text>
      <text class="mono-small" x="181" y="163" text-anchor="middle">(a+2,a+1)</text>
      <text class="mono-small" x="303" y="163" text-anchor="middle">(a+2,a+2)</text>
    </g>

    <path class="soft-arrow" d="M674,94 L724,94"/>
    <rect class="neutral" x="736" y="64" width="120" height="60" rx="10"/>
    <text class="mono-small" x="796" y="89" text-anchor="middle">EOI/text</text>
    <text class="mono-small" x="796" y="110" text-anchor="middle">cursor a+16</text>

    <g transform="translate(900,0)">
      <text class="h3" x="0" y="20">frequency-pair index</text>
      <g transform="translate(0,38)"><rect class="row" width="42" height="44" rx="7"/><text class="axisText" x="21" y="22">R</text><text class="small" x="21" y="62" text-anchor="middle">0</text></g>
      <g transform="translate(46,38)"><rect class="col" width="42" height="44" rx="7"/><text class="axisText" x="21" y="22">C</text><text class="small" x="21" y="62" text-anchor="middle">1</text></g>
      <g transform="translate(92,38)"><rect class="row" width="42" height="44" rx="7"/><text class="axisText" x="21" y="22">R</text><text class="small" x="21" y="62" text-anchor="middle">2</text></g>
      <g transform="translate(138,38)"><rect class="col" width="42" height="44" rx="7"/><text class="axisText" x="21" y="22">C</text><text class="small" x="21" y="62" text-anchor="middle">3</text></g>
      <g transform="translate(184,38)"><rect class="row" width="42" height="44" rx="7"/><text class="axisText" x="21" y="22">R</text><text class="small" x="21" y="62" text-anchor="middle">4</text></g>
      <g transform="translate(230,38)"><rect class="col" width="42" height="44" rx="7"/><text class="axisText" x="21" y="22">C</text><text class="small" x="21" y="62" text-anchor="middle">5</text></g>
      <text class="h2" x="288" y="72">…</text>
      <text class="small" x="0" y="126">row/column 获得相同频谱分布</text>
      <text class="small" x="0" y="150">text 使用 (p,p)，严格兼容原 Qwen 1D RoPE</text>
      <text class="small" x="0" y="174">共同加 anchor 不改变 image-image 相对相位</text>
    </g>
  </g>

  <rect x="40" y="770" width="1360" height="126" rx="18" fill="#172033"/>
  <text x="70" y="806" style="font:700 20px Inter,'Noto Sans SC',Arial,sans-serif;fill:#ffffff">Seed 42 · 10K formal evaluation</text>
  <g transform="translate(70,822)">
    <text x="0" y="27" style="font:600 15px Inter,'Noto Sans SC',Arial,sans-serif;fill:#dce3f2">E0 baseline</text>
    <text x="115" y="27" style="font:700 18px Inter,Arial,sans-serif;fill:#ffffff">FID 26.556</text>
    <path d="M238,20 L286,20" stroke="#aeb9cf" stroke-width="2" marker-end="url(#arrowSoft)"/>
    <text x="306" y="27" style="font:600 15px Inter,'Noto Sans SC',Arial,sans-serif;fill:#dce3f2">E2 joint</text>
    <text x="390" y="27" style="font:700 18px Inter,Arial,sans-serif;fill:#75ddb0">FID 24.789 (−1.767)</text>
    <text x="610" y="27" style="font:700 18px Inter,Arial,sans-serif;fill:#75ddb0">IS 62.052 (+3.409)</text>
    <text x="820" y="27" style="font:600 15px Inter,'Noto Sans SC',Arial,sans-serif;fill:#dce3f2">throughput 1.440/s</text>
    <text x="1035" y="27" style="font:600 15px Inter,'Noto Sans SC',Arial,sans-serif;fill:#ffcf70">单 seed 名义最优；需 matched-seed 确认</text>
  </g>
  <text class="small" x="40" y="925">E2 keeps the contextual flow-head architecture and all training/evaluation settings fixed; only the image-embedder intervention changes.</text>
</svg>
