<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">Selfless-Flow contextual flow head token mixing</title>
  <desc id="desc">For each target latent token, the noisy query cross-attends visible clean latent tokens, while timestep and Qwen condition modulate cross-attention and point-wise MLP blocks through AdaLN gates. No self-attention occurs among noisy query tokens.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fc; }
      .panel { fill: #ffffff; stroke: #d9deea; stroke-width: 2; }
      .title { font-family: Inter,Unifont,sans-serif; font-size: 34px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: Inter,Unifont,sans-serif; font-size: 17px; font-weight: 400; fill: #5b6475; }
      .h2 { font-family: Inter,Unifont,sans-serif; font-size: 22px; font-weight: 700; fill: #172033; }
      .h3 { font-family: Inter,Unifont,sans-serif; font-size: 18px; font-weight: 700; fill: #263247; }
      .body { font-family: Inter,Unifont,sans-serif; font-size: 16px; font-weight: 400; fill: #333c4f; }
      .small { font-family: Inter,Unifont,sans-serif; font-size: 14px; font-weight: 400; fill: #5b6475; }
      .tiny { font-family: Inter,Unifont,sans-serif; font-size: 12px; font-weight: 500; fill: #6d7687; }
      .mono { font-family: monospace,Unifont; font-size: 15px; font-weight: 600; fill: #263247; }
      .query { fill: #eef2ff; stroke: #7c8fe8; stroke-width: 1.7; }
      .context { fill: #eefbf5; stroke: #58a881; stroke-width: 1.7; }
      .condition { fill: #fff8e7; stroke: #d6a43f; stroke-width: 1.7; }
      .cross { fill: #edf9f6; stroke: #2a9d8f; stroke-width: 2; }
      .mlp { fill: #fff6ec; stroke: #e59b59; stroke-width: 2; }
      .output { fill: #fff0ed; stroke: #e76f51; stroke-width: 1.9; }
      .note { fill: #f2f4f8; stroke: #c5ccda; stroke-width: 1.4; }
      .tag { fill: #263247; }
      .tag-text { font-family: Inter,Unifont,sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #657086; stroke-width: 2.5; fill: none; }
      .query-arrow { stroke: #6e80d8; stroke-width: 2.8; fill: none; }
      .context-arrow { stroke: #34977b; stroke-width: 2.8; fill: none; }
      .condition-arrow { stroke: #c58d26; stroke-width: 2.4; fill: none; stroke-dasharray: 8 6; }
      .no-link { stroke: #b8bfcc; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#657086"/>
    </marker>
    <marker id="arrowQuery" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e80d8"/>
    </marker>
    <marker id="arrowContext" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#34977b"/>
    </marker>
    <marker id="arrowCondition" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#c58d26"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#172033" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect class="bg" width="1500" height="860"/>
  <text class="title" x="48" y="58">Selfless-Flow Flow Head: Token Mixing</text>
  <text class="subtitle" x="48" y="89">Each noisy latent is predicted independently; cross-attention to visible clean latents is the only token-mixing path.</text>

  <rect class="panel" x="40" y="120" width="1420" height="620" rx="22" filter="url(#shadow)"/>

  <!-- Inputs -->
  <text class="h2" x="78" y="166">Inputs for target token i</text>

  <rect class="query" x="72" y="200" width="278" height="112" rx="16"/>
  <rect class="tag" x="90" y="216" width="76" height="25" rx="12"/>
  <text class="tag-text" x="128" y="229">QUERY</text>
  <text class="h3" x="90" y="270">Noisy target token</text>
  <text class="mono" x="90" y="296">x_t[i] + P_2D(i)</text>

  <rect class="context" x="72" y="358" width="278" height="132" rx="16"/>
  <rect class="tag" x="90" y="374" width="92" height="25" rx="12"/>
  <text class="tag-text" x="136" y="387">CONTEXT</text>
  <text class="h3" x="90" y="428">Visible clean latents</text>
  <text class="mono" x="90" y="454">{z_j | sigma_j &lt; sigma_i}</text>
  <text class="small" x="90" y="477">Add 2D position; cache as K / V</text>

  <rect class="condition" x="72" y="540" width="278" height="126" rx="16"/>
  <rect class="tag" x="90" y="556" width="108" height="25" rx="12"/>
  <text class="tag-text" x="144" y="569">MODULATION</text>
  <text class="h3" x="90" y="610">Time + Qwen condition</text>
  <text class="mono" x="90" y="638">y_i = E_t(t_i) + W_c h_i</text>
  <text class="small" x="90" y="660">AdaLN shift / scale / gate</text>

  <!-- Projection labels and arrows -->
  <rect class="note" x="380" y="227" width="118" height="58" rx="12"/>
  <text class="small" x="439" y="251" text-anchor="middle">Linear</text>
  <text class="mono" x="439" y="274" text-anchor="middle">16→1280</text>
  <line x1="350" y1="256" x2="376" y2="256" stroke="#6e80d8" stroke-width="2.8"/>
  <polygon points="376,256 365,250 365,262" fill="#6e80d8"/>

  <rect class="note" x="380" y="393" width="118" height="64" rx="12"/>
  <text class="small" x="439" y="418" text-anchor="middle">Linear + Pos</text>
  <text class="mono" x="439" y="443" text-anchor="middle">K / V cache</text>
  <line x1="350" y1="424" x2="376" y2="424" stroke="#34977b" stroke-width="2.8"/>
  <polygon points="376,424 365,418 365,430" fill="#34977b"/>

  <!-- Repeated flow block -->
  <rect class="panel" x="536" y="164" width="598" height="492" rx="20"/>
  <text class="h2" x="566" y="207">Contextual Flow Block</text>
  <rect class="tag" x="1014" y="181" width="84" height="30" rx="15"/>
  <text class="tag-text" x="1056" y="196">× 8</text>

  <rect class="cross" x="582" y="246" width="504" height="164" rx="17"/>
  <text class="h3" x="834" y="278" text-anchor="middle">Gated Cross-Attention</text>
  <text class="mono" x="834" y="310" text-anchor="middle">Q = AdaLN(x_i ; y_i)</text>
  <text class="mono" x="834" y="338" text-anchor="middle">K,V = cache(z_j, P_2D(j))</text>
  <text class="mono" x="834" y="376" text-anchor="middle">x_i &lt;- x_i + g_cross * Attn(Q,K,V)</text>
  <text class="small" x="834" y="399" text-anchor="middle">Mix content and spatial context from generated tokens</text>

  <rect class="mlp" x="582" y="462" width="504" height="132" rx="17"/>
  <text class="h3" x="834" y="495" text-anchor="middle">Gated Point-wise MLP</text>
  <text class="mono" x="834" y="530" text-anchor="middle">x_i &lt;- x_i + g_mlp * MLP(AdaLN(x_i ; y_i))</text>
  <text class="small" x="834" y="562" text-anchor="middle">MLP ratio = 1.0; no communication among noisy tokens</text>

  <line x1="834" y1="412" x2="834" y2="456" stroke="#657086" stroke-width="2.5"/>
  <polygon points="834,456 828,445 840,445" fill="#657086"/>
  <line x1="1087" y1="528" x2="1120" y2="528" stroke="#657086" stroke-width="2.5"/>
  <line x1="1120" y1="528" x2="1120" y2="224" stroke="#657086" stroke-width="2.5"/>
  <line x1="1120" y1="224" x2="1088" y2="224" stroke="#657086" stroke-width="2.5"/>
  <polygon points="1088,224 1099,218 1099,230" fill="#657086"/>
  <text class="tiny" x="1113" y="379" transform="rotate(-90 1113 379)" text-anchor="middle">repeat</text>

  <!-- Input routing -->
  <line x1="498" y1="256" x2="540" y2="256" stroke="#6e80d8" stroke-width="2.8"/>
  <line x1="540" y1="256" x2="540" y2="300" stroke="#6e80d8" stroke-width="2.8"/>
  <line x1="540" y1="300" x2="578" y2="300" stroke="#6e80d8" stroke-width="2.8"/>
  <polygon points="578,300 567,294 567,306" fill="#6e80d8"/>
  <text class="tiny" x="524" y="270">Q path</text>
  <line x1="498" y1="425" x2="550" y2="425" stroke="#34977b" stroke-width="2.8"/>
  <line x1="550" y1="425" x2="550" y2="346" stroke="#34977b" stroke-width="2.8"/>
  <line x1="550" y1="346" x2="578" y2="346" stroke="#34977b" stroke-width="2.8"/>
  <polygon points="578,346 567,340 567,352" fill="#34977b"/>
  <text class="tiny" x="515" y="414">K/V path</text>
  <line x1="350" y1="603" x2="520" y2="603" stroke="#c58d26" stroke-width="2.4" stroke-dasharray="8 6"/>
  <line x1="520" y1="603" x2="520" y2="216" stroke="#c58d26" stroke-width="2.4" stroke-dasharray="8 6"/>
  <line x1="520" y1="216" x2="578" y2="216" stroke="#c58d26" stroke-width="2.4" stroke-dasharray="8 6"/>
  <polygon points="578,216 567,210 567,222" fill="#c58d26"/>
  <text class="tiny" x="416" y="586">AdaLN-Zero modulation</text>

  <!-- Output -->
  <line x1="1134" y1="410" x2="1208" y2="410" stroke="#6e80d8" stroke-width="2.8"/>
  <polygon points="1208,410 1197,404 1197,416" fill="#6e80d8"/>
  <rect class="output" x="1214" y="336" width="196" height="148" rx="17"/>
  <text class="h3" x="1312" y="373" text-anchor="middle">Final AdaLN</text>
  <text class="body" x="1312" y="402" text-anchor="middle">+ Linear 1280→16</text>
  <line x1="1312" y1="417" x2="1312" y2="442" stroke="#657086" stroke-width="2.5"/>
  <polygon points="1312,442 1306,431 1318,431" fill="#657086"/>
  <text class="mono" x="1312" y="468" text-anchor="middle">velocity v_hat[i]</text>

  <!-- Key takeaway -->
  <rect class="note" x="1204" y="538" width="216" height="118" rx="16"/>
  <text class="h3" x="1312" y="570" text-anchor="middle">No query self-attention</text>
  <circle cx="1261" cy="608" r="17" fill="#dfe5f2" stroke="#8290aa" stroke-width="1.5"/>
  <circle cx="1363" cy="608" r="17" fill="#dfe5f2" stroke="#8290aa" stroke-width="1.5"/>
  <text class="mono" x="1261" y="614" text-anchor="middle">x_i</text>
  <text class="mono" x="1363" y="614" text-anchor="middle">x_k</text>
  <line x1="1281" y1="608" x2="1343" y2="608" stroke="#b8bfcc" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M1303,593 L1321,623 M1321,593 L1303,623" stroke="#d05b4b" stroke-width="3"/>
  <text class="tiny" x="1312" y="643" text-anchor="middle">no noisy-token mixing</text>

  <!-- Footer statement -->
  <rect x="40" y="772" width="1420" height="58" rx="16" fill="#263247"/>
  <text x="750" y="807" text-anchor="middle" style="font-family: Inter,Unifont,sans-serif; font-size: 18px; font-weight: 600; fill: #ffffff;">
    Token mixing = cross-attention from one noisy query to visible clean-latent memory; noisy queries remain independent.
  </text>
</svg>
