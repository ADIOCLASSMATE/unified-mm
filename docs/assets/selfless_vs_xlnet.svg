<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" font-family="WenQuanYi Zen Hei">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#182230" flood-opacity="0.09"/></filter>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#12B76A"/></marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#F79009"/></marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#667085"/></marker>
    <style>
      text{font-family:'WenQuanYi Zen Hei','Droid Sans Fallback',sans-serif}.title{font-size:34px;font-weight:700;fill:#101828}.subtitle{font-size:19px;font-weight:400;fill:#667085}.panelTitle{font-size:26px;font-weight:700;fill:#101828}.boxTitle{font-size:21px;font-weight:700;fill:#101828}.boxText{font-size:18px;font-weight:400;fill:#475467}.small{font-size:16px;font-weight:400;fill:#667085}.chip{font-size:16px;font-weight:600}.green{fill:none;stroke:#12B76A;stroke-width:4;marker-end:url(#arrowGreen)}.orange{fill:none;stroke:#F79009;stroke-width:4;marker-end:url(#arrowOrange)}.gray{fill:none;stroke:#667085;stroke-width:3;marker-end:url(#arrowGray)}
    </style>
  </defs>
  <rect width="1600" height="930" fill="#F7F9FC"/>
  <text x="64" y="62" class="title">Selfless 与 XLNet：差异只发生在 Content Stream 的对角线</text>
  <text x="64" y="98" class="subtitle">两者的 Query Stream 相同；需要实验验证，更干净的 local / context 分解是否真的更好</text>

  <rect x="54" y="144" width="718" height="594" rx="28" fill="#FFFFFF" stroke="#6CE9A6" stroke-width="3" filter="url(#shadow)"/>
  <rect x="82" y="170" width="170" height="38" rx="19" fill="#ECFDF3"/>
  <text x="167" y="196" text-anchor="middle" class="chip" fill="#027A48">当前 Selfless</text>
  <text x="82" y="252" class="panelTitle">Content Stream：自身不能走 Attention</text>

  <rect x="92" y="300" width="158" height="74" rx="16" fill="#ECFDF3" stroke="#6CE9A6"/>
  <text x="171" y="330" text-anchor="middle" class="boxTitle">过去 token</text>
  <text x="171" y="357" text-anchor="middle" class="small">x&lt;i</text>
  <rect x="92" y="438" width="158" height="74" rx="16" fill="#EAF0FF" stroke="#B2CCFF"/>
  <text x="171" y="468" text-anchor="middle" class="boxTitle">当前 token</text>
  <text x="171" y="495" text-anchor="middle" class="small">xᵢ</text>

  <rect x="310" y="300" width="178" height="74" rx="16" fill="#ECFDF3"/>
  <text x="399" y="330" text-anchor="middle" class="boxTitle">Attention</text>
  <text x="399" y="357" text-anchor="middle" class="small">只汇聚其他位置</text>
  <rect x="310" y="438" width="178" height="74" rx="16" fill="#EAF0FF"/>
  <text x="399" y="468" text-anchor="middle" class="boxTitle">Residual</text>
  <text x="399" y="495" text-anchor="middle" class="small">保留 local representation</text>

  <rect x="552" y="354" width="172" height="110" rx="20" fill="#FFFFFF" stroke="#344054" stroke-width="2"/>
  <text x="638" y="394" text-anchor="middle" class="boxTitle">h_content,i</text>
  <text x="638" y="426" text-anchor="middle" class="small">local + context</text>
  <text x="638" y="451" text-anchor="middle" class="small">两条来源互不混淆</text>

  <path d="M250 337 L310 337" class="green"/><path d="M488 337 C526 337 526 384 552 384" class="green"/>
  <path d="M250 475 L310 475" fill="none" stroke="#4C6FFF" stroke-width="4" marker-end="url(#arrowGray)"/><path d="M488 475 C526 475 526 434 552 434" fill="none" stroke="#4C6FFF" stroke-width="4" marker-end="url(#arrowGray)"/>
  <path d="M250 455 C282 428 282 384 310 357" fill="none" stroke="#F04438" stroke-width="4" stroke-dasharray="9 7"/>
  <line x1="272" y1="397" x2="294" y2="419" stroke="#F04438" stroke-width="5"/><line x1="294" y1="397" x2="272" y2="419" stroke="#F04438" stroke-width="5"/>
  <text x="282" y="445" text-anchor="middle" class="small" fill="#D92D20">对角线移除</text>

  <rect x="88" y="560" width="636" height="132" rx="20" fill="#F8FAFC" stroke="#D0D5DD"/>
  <text x="112" y="598" class="boxTitle">Query Stream（两者相同）</text>
  <rect x="112" y="618" width="126" height="48" rx="14" fill="#FFF7E6"/><text x="175" y="649" text-anchor="middle" class="boxText">Mask Rₘ</text>
  <text x="260" y="649" class="boxText">+</text>
  <rect x="292" y="618" width="210" height="48" rx="14" fill="#ECFDF3"/><text x="397" y="649" text-anchor="middle" class="boxText">过去上下文 C&lt;i</text>
  <path d="M502 642 L566 642" class="gray"/>
  <rect x="572" y="618" width="126" height="48" rx="14" fill="#FFF7E6"/><text x="635" y="649" text-anchor="middle" class="boxText">h_query,i</text>

  <rect x="828" y="144" width="718" height="594" rx="28" fill="#FFFFFF" stroke="#FEC84B" stroke-width="3" filter="url(#shadow)"/>
  <rect x="856" y="170" width="146" height="38" rx="19" fill="#FFF7E6"/>
  <text x="929" y="196" text-anchor="middle" class="chip" fill="#B54708">XLNet 形式</text>
  <text x="856" y="252" class="panelTitle">Content Stream：自身也进入 Attention</text>

  <rect x="866" y="300" width="158" height="74" rx="16" fill="#ECFDF3" stroke="#6CE9A6"/>
  <text x="945" y="330" text-anchor="middle" class="boxTitle">过去 token</text>
  <text x="945" y="357" text-anchor="middle" class="small">x&lt;i</text>
  <rect x="866" y="438" width="158" height="74" rx="16" fill="#EAF0FF" stroke="#B2CCFF"/>
  <text x="945" y="468" text-anchor="middle" class="boxTitle">当前 token</text>
  <text x="945" y="495" text-anchor="middle" class="small">xᵢ</text>

  <rect x="1084" y="300" width="178" height="74" rx="16" fill="#FFF7E6"/>
  <text x="1173" y="330" text-anchor="middle" class="boxTitle">Attention</text>
  <text x="1173" y="357" text-anchor="middle" class="small">过去 + 自身</text>
  <rect x="1084" y="438" width="178" height="74" rx="16" fill="#EAF0FF"/>
  <text x="1173" y="468" text-anchor="middle" class="boxTitle">Residual</text>
  <text x="1173" y="495" text-anchor="middle" class="small">保留 local representation</text>

  <rect x="1326" y="354" width="172" height="110" rx="20" fill="#FFFFFF" stroke="#344054" stroke-width="2"/>
  <text x="1412" y="394" text-anchor="middle" class="boxTitle">h_content,i</text>
  <text x="1412" y="426" text-anchor="middle" class="small">local + context</text>
  <text x="1412" y="451" text-anchor="middle" class="small">自身信息存在两条路径</text>

  <path d="M1024 337 L1084 337" class="green"/><path d="M1262 337 C1300 337 1300 384 1326 384" class="orange"/>
  <path d="M1024 475 L1084 475" fill="none" stroke="#4C6FFF" stroke-width="4" marker-end="url(#arrowGray)"/><path d="M1262 475 C1300 475 1300 434 1326 434" fill="none" stroke="#4C6FFF" stroke-width="4" marker-end="url(#arrowGray)"/>
  <path d="M1024 455 C1054 420 1054 378 1084 350" class="orange"/>
  <text x="1054" y="416" text-anchor="middle" class="small" fill="#B54708">self edge</text>

  <rect x="862" y="560" width="636" height="132" rx="20" fill="#F8FAFC" stroke="#D0D5DD"/>
  <text x="886" y="598" class="boxTitle">Query Stream（两者相同）</text>
  <rect x="886" y="618" width="126" height="48" rx="14" fill="#FFF7E6"/><text x="949" y="649" text-anchor="middle" class="boxText">Mask Rₘ</text>
  <text x="1034" y="649" class="boxText">+</text>
  <rect x="1066" y="618" width="210" height="48" rx="14" fill="#ECFDF3"/><text x="1171" y="649" text-anchor="middle" class="boxText">过去上下文 C&lt;i</text>
  <path d="M1276 642 L1340 642" class="gray"/>
  <rect x="1346" y="618" width="126" height="48" rx="14" fill="#FFF7E6"/><text x="1409" y="649" text-anchor="middle" class="boxText">h_query,i</text>

  <rect x="54" y="782" width="1492" height="102" rx="24" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
  <rect x="82" y="806" width="302" height="54" rx="16" fill="#ECFDF3"/><text x="233" y="839" text-anchor="middle" class="boxText">Selfless 假设：local / context 更可分</text>
  <rect x="410" y="806" width="332" height="54" rx="16" fill="#EAF0FF"/><text x="576" y="839" text-anchor="middle" class="boxText">文本与图像 hidden 信息组成一致</text>
  <rect x="768" y="806" width="326" height="54" rx="16" fill="#F2F4F7"/><text x="931" y="839" text-anchor="middle" class="boxText">两者都可训练双流、推理单流</text>
  <rect x="1120" y="806" width="398" height="54" rx="16" fill="#FFF7E6"/><text x="1319" y="839" text-anchor="middle" class="boxText">结论：必须用严格受控消融决定取舍</text>
</svg>
