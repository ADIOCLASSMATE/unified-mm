<div class="forward-overview"><div class="section-kicker">FORWARD / 架构速览</div><h2>S2-single、B、Z：一次 forward 与去噪循环</h2><p class="note">主图画图像生成路径，橙色虚线框标出每个去噪时间步重复执行的模块；下方补充文本 / I2T 路径。xₜ 是当前噪声图像 latent，t 是去噪时间，σ 是 token 的生成次序。</p><div class="forward-grid"><figure class="forward-card"><h3>S2-single</h3><p class="note">整图 flow · backbone 随时间步刷新</p><svg viewBox="0 0 360 430" role="img" aria-label="S2-single 图像生成 forward；整图 flow · backbone 随时间步刷新"><title>S2-single 图像生成 forward；整图 flow · backbone 随时间步刷新</title><rect class="fwd-loop" x="18" y="63" width="324" height="355" rx="12"/><text x="32" y="82" class="fwd-loop-label">时间步循环：backbone + head</text><rect class="fwd-node " x="40" y="9" width="274" height="36" rx="8"/><text x="177" y="32" class="fwd-main">文本 / 已知上下文</text><path class="fwd-line" d="M177 45V95"/><path class="fwd-tip" d="M172 94l5 7 5-7Z"/><rect class="fwd-node " x="40" y="101" width="274" height="54" rx="8"/><text x="177" y="124" class="fwd-main">整图 noisy latent xₜ + t</text><text x="177" y="143" class="fwd-sub">与上下文一起输入</text><path class="fwd-line" d="M177 155V170"/><path class="fwd-tip" d="M172 169l5 7 5-7Z"/><rect class="fwd-node fwd-backbone" x="40" y="176" width="274" height="54" rx="8"/><text x="177" y="199" class="fwd-main">单流 Qwen backbone</text><text x="177" y="218" class="fwd-sub">图像块内部双向 attention</text><path class="fwd-line" d="M177 230V267"/><path class="fwd-tip" d="M172 266l5 7 5-7Z"/><rect class="fwd-node fwd-head" x="40" y="273" width="274" height="54" rx="8"/><text x="177" y="296" class="fwd-main">S2 flow head + t</text><text x="177" y="315" class="fwd-sub">整图双向 · 时间调制</text><path class="fwd-line" d="M177 327V363"/><path class="fwd-tip" d="M172 362l5 7 5-7Z"/><rect class="fwd-node " x="40" y="369" width="274" height="36" rx="8"/><text x="177" y="392" class="fwd-main">预测速度 v → 更新整图 xₜ</text><path class="fwd-feedback" d="M314 387H329V127H315"/><path class="fwd-return-tip" d="M320 122l-7 5 7 5Z"/></svg><figcaption><p><strong>文本 / I2T：</strong>h[i−1] → LM head → token[i]</p><p>图像块双向可见；文本 shift 一位。</p><p class="note">xₜ、t 进入 backbone，head 也使用 t；每次速度估计刷新整条路径。</p></figcaption></figure><figure class="forward-card"><h3>B</h3><p class="note">逐 latent flow · backbone 条件复用</p><svg viewBox="0 0 360 430" role="img" aria-label="B 图像生成 forward；逐 latent flow · backbone 条件复用"><title>B 图像生成 forward；逐 latent flow · backbone 条件复用</title><rect class="fwd-loop" x="18" y="232" width="324" height="186" rx="12"/><text x="32" y="251" class="fwd-loop-label">时间步循环：仅 flow head</text><rect class="fwd-node " x="40" y="9" width="274" height="54" rx="8"/><text x="177" y="32" class="fwd-main">已知内容 + learned mask</text><text x="177" y="51" class="fwd-sub">content / query 双流</text><path class="fwd-line" d="M177 63V77"/><path class="fwd-tip" d="M172 76l5 7 5-7Z"/><rect class="fwd-node fwd-backbone" x="40" y="83" width="274" height="54" rx="8"/><text x="177" y="106" class="fwd-main">双流 Qwen backbone</text><text x="177" y="125" class="fwd-sub">图像按 σ 因果可见</text><path class="fwd-line" d="M177 137V151"/><path class="fwd-tip" d="M172 150l5 7 5-7Z"/><rect class="fwd-node " x="40" y="157" width="274" height="54" rx="8"/><text x="177" y="180" class="fwd-main">固定 h_query / h_content</text><text x="177" y="199" class="fwd-sub">本轮 token 去噪期间复用</text><path class="fwd-line" d="M40 184H28V319H35"/><path class="fwd-tip" d="M33 314l7 5-7 5Z"/><text x="177" y="278" class="fwd-sub">noisy latent xₜ + t ↓</text><rect class="fwd-node fwd-head" x="40" y="292" width="274" height="54" rx="8"/><text x="177" y="315" class="fwd-main">B contextual flow head</text><text x="177" y="334" class="fwd-sub">双流 · σ 因果 attention</text><path class="fwd-line" d="M177 346V363"/><path class="fwd-tip" d="M172 362l5 7 5-7Z"/><rect class="fwd-node " x="40" y="369" width="274" height="36" rx="8"/><text x="177" y="392" class="fwd-main">预测速度 v → 更新目标 latent</text><path class="fwd-feedback" d="M314 387H329V316H315"/><path class="fwd-return-tip" d="M320 311l-7 5 7 5Z"/></svg><figcaption><p><strong>文本 / I2T：</strong>query[i] → LM head → token[i]</p><p>图像按 σ 因果可见；同位置预测。</p><p class="note">生成下一 token 时更新上下文 / KV cache；不随同一 token 的 t 重跑 backbone。</p></figcaption></figure><figure class="forward-card"><h3>Z</h3><p class="note">整图 flow · backbone 一次前向</p><svg viewBox="0 0 360 430" role="img" aria-label="Z 图像生成 forward；整图 flow · backbone 一次前向"><title>Z 图像生成 forward；整图 flow · backbone 一次前向</title><rect class="fwd-loop" x="18" y="232" width="324" height="186" rx="12"/><text x="32" y="251" class="fwd-loop-label">时间步循环：仅 DiT head</text><rect class="fwd-node " x="40" y="9" width="274" height="54" rx="8"/><text x="177" y="32" class="fwd-main">已知上下文 + 整图 mask</text><text x="177" y="51" class="fwd-sub">目标图像 query 不读 clean target</text><path class="fwd-line" d="M177 63V77"/><path class="fwd-tip" d="M172 76l5 7 5-7Z"/><rect class="fwd-node fwd-backbone" x="40" y="83" width="274" height="54" rx="8"/><text x="177" y="106" class="fwd-main">双流 Qwen backbone</text><text x="177" y="125" class="fwd-sub">同图共享 σ · content 图像双向</text><path class="fwd-line" d="M177 137V151"/><path class="fwd-tip" d="M172 150l5 7 5-7Z"/><rect class="fwd-node " x="40" y="157" width="274" height="54" rx="8"/><text x="177" y="180" class="fwd-main">固定整图 query hidden</text><text x="177" y="199" class="fwd-sub">一次 backbone，所有时间步复用</text><path class="fwd-line" d="M40 184H28V319H35"/><path class="fwd-tip" d="M33 314l7 5-7 5Z"/><text x="177" y="278" class="fwd-sub">整图 noisy latent xₜ + 共享 t ↓</text><rect class="fwd-node fwd-head" x="40" y="292" width="274" height="54" rx="8"/><text x="177" y="315" class="fwd-main">单流双向 DiT head</text><text x="177" y="334" class="fwd-sub">固定条件 + xₜ；t 调制</text><path class="fwd-line" d="M177 346V363"/><path class="fwd-tip" d="M172 362l5 7 5-7Z"/><rect class="fwd-node " x="40" y="369" width="274" height="36" rx="8"/><text x="177" y="392" class="fwd-main">预测速度 v → 更新整图 xₜ</text><path class="fwd-feedback" d="M314 387H329V316H315"/><path class="fwd-return-tip" d="M320 311l-7 5 7 5Z"/></svg><figcaption><p><strong>文本 / I2T：</strong>query[i] → LM head → token[i]</p><p>图像块双向可见；同位置预测。</p><p class="note">整图联合去噪；所有时间步复用一次 backbone 的条件。</p></figcaption></figure></div><p class="note">I2T 输入已知的 clean 图像，经 backbone → LM head 预测文本，不走上面的图像去噪循环。B / Z 的文本 query 不读取目标位置 content；backbone 不进入时间步循环仍然参与训练、接收梯度。图中省略 projector、VAE 与 CFG 分支。</p></div>
