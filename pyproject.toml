[project]
name = "unified-mm"
version = "0.1.0"
description = "Selfless-Flow training and evaluation on Ascend NPU"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.13.0",
    "anthropic>=0.100.0",
    "datasets>=4.8.5",
    # Runtime imports used by the CANN TBE Python adapter.
    "decorator>=5.2,<6",
    "deepspeed>=0.18.9",
    "diffusers>=0.38.0",
    "lightning>=2.6.1",
    # CANN 7.3 TBE still imports aliases removed by NumPy 2.x.
    "numpy==1.26.4",
    "omegaconf>=2.3.0",
    "openai>=2.34.0",
    "peft>=0.19.1",
    "pytest>=9.1.1",
    "pytorch-lightning>=2.6.1",
    "ruamel-yaml>=0.19.1",
    "scipy>=1.17.1",
    "setuptools>=65",
    "timm>=1.0.26",
    "torch==2.6.0",
    "torch-npu==2.6.0.post5",
    "torch-fidelity>=0.4.0",
    "torchmetrics>=1.8.0",
    "torchvision==0.21.0",
    "transformers>=5.7.0",
    "wandb>=0.26.1",
    "webdataset>=1.0.2",
]

# Ascend torch_npu uses PyTorch's CPU wheel as its PrivateUse1 host runtime.
# Keeping torch/torchvision on this explicit index prevents uv from resolving
# NVIDIA CUDA and NCCL wheels from the default PyPI builds.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
