experiment:
    project: "qwen-showo-vq-ablation-imagenet100-80ep"
    name: "qwen3base-showo-vq-imagenet100-8gpu-b256-80ep"
    wandb_project: "unified-mm"
    output_dir: "output"
    use_wandb: true
    log_every: 10
    val_every: 2245
    save_every: 8980
    save_hf_every: 35920
    save_final: true
    checkpoints_total_limit: 4
    resume_from_checkpoint: none

model:
    architecture: "qwen_showo"
    model_path: "public/models/Qwen/Qwen3-0.6B-Base"
    image_vocab_size: 8192
    image_tokens_per_img: 256
    image_loss_chunk_size: 1024
    use_cache: false

dataset:
    class_name: "QwenShowOImageNetDataset"
    params:
        tokens_path: "public/datasets/imagenet_ablation_100c_balanced/vq_tokens_magvit2_showo_8192/tokens.pt"
        manifest_jsonl: "public/datasets/imagenet_ablation_100c_balanced/manifest.jsonl"
        split_manifest_jsonl: "public/datasets/imagenet_ablation_100c_balanced/split_seed42_val100.jsonl"
        synset_mapping_path: "public/datasets/imagenet/LOC_synset_mapping.txt"
        num_classes: 100
        image_tokens_per_img: 256
        image_vocab_size: 8192
        class_prompt_template: "{class_name}"
        max_text_tokens: 48
        max_seq_length: 320
        pad_to_length: 320
        val_ratio: 0.08
        val_samples_per_class: 100
        split_strategy: "stratified"
        split_seed: 42
        cond_dropout_prob: 0.1
        min_masking_rate: 0.0

optimizer:
    name: "adamw"
    params:
        learning_rate: 2.0e-5
        backbone_learning_rate: 2.0e-5
        embedding_learning_rate: 1.0e-4
        beta1: 0.9
        beta2: 0.95
        weight_decay: 0.01
        epsilon: 1.0e-8

lr_scheduler:
    scheduler: "wsd"
    params:
        warmup_steps: 2000
        decay_steps: 8980
        min_lr_scale: 0.1

training:
    batch_size: 32
    val_batch_size: 32
    total_batch_size: 256
    mixed_precision: "bf16"
    seed: 42
    dataloader_workers: 8
    max_train_steps: 35920
    max_grad_norm: 1.0
    use_gradient_checkpointing: false
    step_scheduler_with_optimizer: false
    from_scratch: false

evaluation:
    image_mask_ratio: 0.75
    max_val_batches: 32
    generation_timesteps: 12
    # Official Show-o uses s in (1+s)*cond-s*uncond. This is common CFG w=12.75.
    guidance_scale: 11.75
    common_cfg_scale: 12.75
    temperature: 1.0
    samples: 10000
    batch_size: 8
    seed: 42
    fid_feature: 2048
    is_splits: 10
    real_stats_path: "public/datasets/imagenet_ablation_100c_balanced/fid_stats/inception_v3_2048_original_256.pt"
    inception_weights_path: "output/cache/inception/weights-inception-2015-12-05-6726825d.pth"
    showo_repo: "/inspire/hdd/global_user/wanjiaxin-253108030048/code/Show-o"
    vq_model_path: "public/models/showlab/magvitv2"
