experiment:
    project: "selfless-flow-image-embedder-e0-seed42"
    name: "imagenet100-image-embedder-e0-seed42-qwen3base-8gpu-b256-80ep"
    wandb_project: "unified-mm"
    output_dir: "output"
    save_every: 8980
    eval_every: 2245
    generate_every: 4490
    log_every: 10
    log_grad_norm_every: 449
    checkpoints_total_limit: 4
    save_hfmodel_every: 35920
    val_every: 2245
    validation_image_every: 4490
    validation_image_samples: 8
    validation_flow_temperature: 1.0
    validation_flow_cfg: 3.5
    validation_flow_cfg_schedule: "constant"
    validation_flow_solver: "heun"
    validation_flow_probe_times: [0.25, 0.5, 0.75, 0.95]
    validation_vae_dtype: "fp32"
    validation_save_debug_images: false
    validation_single_stream_images: true
    validation_single_stream_parallel_rate: 1
    validation_single_stream_order_strategy: "spatial_halton"
    validation_single_stream_order_strategies:
        - "spatial_halton"
    validation_vae_module_root: "/inspire/hdd/global_user/wanjiaxin-253108030048/code/mar"
    validation_vae_path: "public/vae/mar-kl16/kl16.ckpt"
    validation_vae_scaling_factor: 0.2325
    resume_from_checkpoint: none
    ablation_id: "E0"

model:
    model_path: "public/models/Qwen/Qwen3-0.6B-Base"
    attention_pattern: "ar"
    loss_attention_pattern: "likelihood"
    mask_id: -1
    use_flex_attention: true
    lambda_text: 0.0
    lambda_image: 1.0
    continuous_image_latents: true
    image_token_embedder_init_mode: "balanced"
    image_token_embedder_latent_rms: 1.0
    image_backbone_variant: "E2-Q1"
    image_generation_head_type: "flow"
    image_flow_head_arch: "contextual"
    image_flow_depth: 8
    image_flow_width: 1280
    image_flow_num_sampling_steps: "100"
    image_flow_batch_mul: 4
    image_flow_time_scale: 1000.0
    image_flow_time_sampling: "logit_normal"
    image_flow_logit_mean: 0.0
    image_flow_logit_std: 1.0
    image_flow_time_eps: 1.0e-5
    image_flow_time_uniform_mix: 0.1
    image_flow_solver: "heun"
    image_flow_mlp_ratio: 1.0
    image_flow_latent_mixer_heads: 8
    image_flow_latent_mixer_dropout: 0.0
    image_flow_latent_mixer_zero_init_gate: true
    image_input_noise_strength: 1.0e-2
    image_input_noise_strength_std: 0.0
    image_input_noise_strength_min: null
    image_input_noise_strength_max: null
    image_uncond_prob: 0.1
    reinitialize_image_modules: true
    pretrained_image_flow_adapter: none

dataset:
    class_name: "ImageNetFlowCacheDataset"
    params:
        cache_path: "public/datasets/imagenet_ablation_100c_balanced/vae_latents_mar_kl16/flow_latents_100c_1250pc_fp16.pt"
        manifest_jsonl: "public/datasets/imagenet_ablation_100c_balanced/manifest.jsonl"
        split_manifest_jsonl: "public/datasets/imagenet_ablation_100c_balanced/split_seed42_val100.jsonl"
        synset_mapping_path: "public/datasets/imagenet/LOC_synset_mapping.txt"
        num_classes: 100
        conditioning_mode: "class_image"
        label_text: false
        max_seq_length: 320
        pad_to_length: 320
        pad_to_multiple_of: 64
        val_ratio: 0.08
        val_samples_per_class: 100
        split_strategy: "stratified"
        split_seed: 42
        latent_hflip_prob: 0.5
    preprocessing:
        max_seq_length: 320

optimizer:
    name: adamw
    params:
        learning_rate: 1.0e-4
        backbone_learning_rate: 2.0e-5
        projector_learning_rate: 1.0e-4
        flow_learning_rate: 1.0e-4
        special_token_learning_rate: 2.0e-5
        scale_lr: false
        beta1: 0.9
        beta2: 0.95
        weight_decay: 0.01
        epsilon: 1e-8

lr_scheduler:
    scheduler: "wsd"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 2000
        decay_steps: 8980
        min_lr_scale: 0.1

training:
    batch_size: 32
    total_batch_size: 256
    mixed_precision: "bf16"
    enable_tf32: true
    seed: 42
    dataloader_workers: 8
    max_train_steps: 35920
    max_grad_norm: 1.0
    ar_ratio: -1.0
    mc_samples: 16
    use_gradient_checkpointing: false
    step_scheduler_with_optimizer: false
    from_scratch: false
    freeze_backbone_for_image_flow_warmup: false
    use_ema: true
    ema_decay: 0.999
    ema_update_after_step: 0
    ema_validate: false
    ema_save_adapter: true
    ema_save_hf_model: true
    save_image_flow_adapter: true

evaluation:
    checkpoint: "output/image_backbone_ablation/runs/selfless-flow-image-embedder-e2-seed42/hf_model-final-ema"
    model_dtype: "bf16"
    samples: 10000
    batch_size: 512
    sampling_steps: 100
    temperature: 1.0
    cfg: 3.5
    cfg_schedule: "constant"
    flow_solver: "heun"
    parallel_rate: 1
    strategies: "spatial_halton"
    seed: 42
    real_stats_path: "public/datasets/imagenet_ablation_100c_balanced/fid_stats/inception_v3_2048_original_256.pt"
