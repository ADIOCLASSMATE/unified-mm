# Formal B-based unified ablation protocol. Every fresh arm starts from the
# same Qwen3-0.6B-Base weights at optimizer step zero. D/E/F are submitted to
# the scaling-law platform project requested for this study.
schema: unified_ablation_100b_v5
base_config: configs/selfless/unified_baseline_100b_ascend_64npu.yaml
platform_project: "多模态大模型新架构评测探索与scaling-law"
historical_platform_project_bc: "随机序语言建模-统一自回归与掩码扩散的随机顺序生成框架"
world_size: 64
nodes: 4
npu_per_node: 16
seed: 42
target_text_tokens: 100000000000
max_train_steps: 95415
save_every: 2000
save_ema_eval_every: 0
validation_every: 2000
checkpoints_total_limit: 3
checkpoint_milestone_every: 0
save_final_resumable_checkpoint: true
qualitative_outputs:
    generated_images: true
    image_to_text_captions: true
    every_steps: 2000
    samples: 2
runtime_hashing_enabled: false
task_loss_logging:
    normalization:
        climbmix: mean_cross_entropy_over_valid_text_targets
        t2i: mean_flow_velocity_mse_over_image_targets_and_latent_channels
        i2t: mean_cross_entropy_over_valid_text_targets
    model_weights:
        text: 0.05
        image: 1.0
    accumulation:
        source_schedule: [climbmix, t2i, climbmix, i2t]
        gradient_accumulation_steps: 4
        formula: mean_of_four_already_weighted_microbatch_losses
    raw_normalized:
        - train/loss_climbmix
        - train/loss_t2i
        - train/loss_i2t
    weighted_contributions:
        - train/weighted_contribution_climbmix
        - train/weighted_contribution_t2i
        - train/weighted_contribution_i2t
    contribution_sum_matches: step_loss
    persistent_jsonl: training_metrics.jsonl
shared:
    initialization: Qwen3-0.6B-Base
    start: qwen_pretrained_step_0
    resume_from_checkpoint: none
    source_schedule: [climbmix, t2i, climbmix, i2t]
    climbmix_tokenization: online
    text_sequence_length: 2048
    image_flow_batch_mul: 4
    global_gradient_checkpointing: false
    image_flow_gradient_checkpointing: false
    selected_lr:
        rerun: false
        backbone_and_special_lr: 3.0e-4
        flow_and_projector_lr: 5.0e-5
    imagenet:
        train:
            split: train
            records: 1281167
        validation:
            split: val
            records: 50000
            cached_kl16_posterior: true
            tasks_per_image: [t2i, i2t]
        train_validation_overlap_allowed: false
comparability:
    baseline: b
    # Singular aliases are retained for downstream reports written against v4.
    b_vs_c_only_allowed_difference: model.architecture_variant
    b_vs_d_only_allowed_difference: model.architecture_variant
    b_vs_c_only_allowed_differences: [model.architecture_variant]
    b_vs_d_only_allowed_differences: [model.architecture_variant]
    b_vs_c_query_stream_identical: true
    b_vs_d_query_stream_identical: false
    b_vs_d_static_contract_identical: true
    b_vs_d_image_flow_batch_mul_identical: true
    b_vs_e_only_allowed_differences:
        - model.training_image_sigma_order
        - dataset.params.image.image_sigma_order
        - experiment.validation_single_stream_order_strategies
        - evaluation.strategies
    b_vs_f_only_allowed_differences:
        - model.architecture_variant
        - model.flow_head_attention_contract
        - model.image_flow_width
        - model.positionwise_reference_flow_width
        - model.positionwise_reference_flow_depth
        - model.positionwise_max_parameter_relative_error
    qwen_pretrained_source_identical: true
    pretrained_backbone_weights_identical: true
    architecture_specific_modules_initialized_from_training_seed: 42
    data_assets_and_source_schedule_identical: true
    optimizer_and_lr_identical: true
    token_budget_identical: true
    validation_samples_steps_and_seeds_identical: true
    image_flow_batch_mul_identical: true
    systems_only_differences:
        d:
            - t2i_dynamic_decoder_activation_checkpointing
            - first_update_bf16_overflow_guard
    systems_only_differences_change_objective: false
run_projects:
    b: unified-b-0p6b-100b-imagenet-split-s42-r1
    c: unified-c-on-b-0p6b-100b-imagenet-split-s42-r1
    d: unified-d-on-b-0p6b-100b-imagenet-split-s42-r3
    e: unified-e-on-b-0p6b-100b-imagenet-split-s42-r1
    f: unified-f-on-b-0p6b-100b-imagenet-split-s42-r1
ablations:
    b:
        status: main_baseline
        architecture_variant: selfless_contextual
        training_objective: selfless_dual_stream
        image_sigma_order: random
        query_attention: "sigma_kv < sigma_q"
        content_attention: "sigma_kv <= sigma_q"
        flow_head_attention_contract: xlnet_content_diagonal
        flow_head_query_attention: "sigma_kv < sigma_q"
        flow_head_content_attention: "sigma_kv <= sigma_q"
        start: qwen_pretrained_step_0
    c:
        architecture_variant: single_stream_text_ar
        training_objective: selfless_dual_stream
        text_stream: single_x0
        text_attention: physical_position_causal
        text_prediction: "hidden[j-1] -> token[j]"
        dual_stream_attention_contract: xlnet_content_diagonal
        flow_head_attention_contract: xlnet_content_diagonal
        image_stream: identical_to_b_selfless_dual_stream
        image_attention: "sigma_kv <= sigma_q"
        image_loss_positions: identical_to_b
        image_sigma_order: random
        start: qwen_pretrained_step_0
    d:
        status: ready_r3_after_64npu_startup_guard_validation
        architecture_variant: dynamic_xt
        training_objective: selfless_dual_stream
        dual_stream_attention_contract: xlnet_content_diagonal
        flow_head_attention_contract: xlnet_content_diagonal
        query_attention: "sigma_kv < sigma_q"
        content_attention: "sigma_kv <= sigma_q"
        backbone_condition: "embed(x_t) + time_embed(t)"
        condition_refresh: every_ode_velocity_evaluation
        dynamic_query_scope: t2i_only
        content_stream_batch: B
        query_stream_batch: 4B_for_t2i_B_otherwise
        image_flow_batch_mul: 4
        t2i_micro_batch_size_per_rank: 16
        rf_states_per_t2i_microbatch_per_rank: 64
        global_gradient_checkpointing: false
        gradient_checkpointing: t2i_dynamic_decoder_layers_only
        startup_loss_trace:
            until_step: 10
            storage: device_only_until_optimizer_boundary
            synchronization: one_gather_per_optimizer_boundary
            changes_training_math: false
        startup_bf16_overflow_guard:
            until_step: 1
            synchronization: deepspeed_pre_update_scan
            disabled_after_step: 1
            steady_state_overhead: none
            changes_training_math: false
        validated_64npu_startup:
            job: umm-d-on-b-startupguard10-v13-64-s42-r1
            steps: 10
            final_loss: 0.6762
            seconds_per_step: 4.1813
        time_embedder_optimizer_role: backbone
        content_compute: once_per_layer
        image_sigma_order: random
        start: qwen_pretrained_step_0
    e:
        status: ready
        base: b
        architecture_variant: selfless_contextual
        model_implementation: identical_to_b
        flow_head_attention_contract: xlnet_content_diagonal
        text_sigma_order: identical_to_b_deterministic_physical_left_to_right
        image_sigma_order: sequential
        generation_order: sequential
        start: qwen_pretrained_step_0
    f:
        status: ready
        base: b
        architecture_variant: positionwise_flow_head_on_b
        model_file: models/modeling_model/modeling_selfless_flow_positionwise_on_b.py
        generation_file: models/modeling_model/modeling_selfless_flow_positionwise_on_b_generation.py
        backbone_and_attention: identical_to_b
        image_sigma_order: random
        flow_head_attention_contract: not_applicable
        flow_head:
            architecture: shared_positionwise_adaln_mlp
            cross_token_attention: false
            content_stream: false
            depth: 8
            width: 1936
            parameters: 163828208
            reference_b_parameters: 164072976
            relative_difference: 0.00149184
            tolerance: 0.005
        start: qwen_pretrained_step_0
