schema: unified_multimodal_likelihood_evaluation_v3
weights: hf_final_ema
runtime_hashing_enabled: false
hardware:
  accelerator: ascend_910b
  world_size: 16
model_source:
  directory_name: hf_model-final-ema
  load_policy: direct_from_pretrained
  step_provenance: ema_export_metadata.json.source_global_step
legacy_weights_compatibility: rank_sharded_ema
scoring:
  model_contract: selfless_same_position_query_stream
  causal_lm_one_token_shift: false
  free_form_generation_required: false
  candidate_target: answer_or_caption_text_without_eos
  primary_candidate_score: mean_token_loglikelihood
  posterior_sample: deterministic_arithmetic_seed
  image_sigma_order: from_model_training_config
tasks:
  - name: mmbench_dev_en
    official_original_questions: 1164
    official_circular_rows: 4329
    protocol_variant: semantic_candidate_normalized_nll
    circular_group_rule: every_rotation_must_be_correct
    primary_metric: circular_accuracy_normalized_loglikelihood
    leaderboard_comparable: false
  - name: seed_bench_image
    records: 14233
    subset: official_SEED_Bench_1_single_image_dimensions_1_to_9
    scoring: semantic_candidate_normalized_nll
    primary_metric: accuracy_normalized_loglikelihood
    leaderboard_comparable: false
  - name: sugarcrepe
    records: 7511
    groups: [add_att, add_obj, replace_att, replace_obj, replace_rel, swap_att, swap_obj]
    primary_metric: accuracy_normalized_loglikelihood
    chance_accuracy: 0.5
  - name: aro_vg_relation
    records: 23937
    scoring: positive_vs_negative_caption
    primary_metric: accuracy_normalized_loglikelihood
    chance_accuracy: 0.5
  - name: aro_vg_attribution
    records: 28748
    scoring: positive_vs_negative_caption
    primary_metric: accuracy_normalized_loglikelihood
    chance_accuracy: 0.5
outputs:
  per_sample_candidate_loglikelihoods: true
  per_task_summary: true
  per_category_summary: true
  record_normalized_scores: true
  no_hashes: true
