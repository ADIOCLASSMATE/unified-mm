shared_optimizer:
    backbone_and_special_learning_rate: 3.0e-4
    flow_and_projector_learning_rate: 5.0e-5
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.01
    flow_weight_decay: 0.01
    max_grad_norm: 1.0
shared_checkpointing:
    save_every: 2000
    validation_every: 2000
    checkpoints_total_limit: 3
    save_final_resumable_checkpoint: true
