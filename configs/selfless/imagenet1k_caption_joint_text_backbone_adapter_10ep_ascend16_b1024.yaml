# Joint Caption + T2I training with split initialization:
# - Qwen3-0.6B-Base supplies the text backbone, tied LM head and ordinary vocab.
# - The completed ImageNet-1K class run supplies only the image-flow adapter and
#   four multimodal special-token embedding rows.
experiment:
    project: "selfless-flow-imagenet1k-caption-joint-text-backbone-adapter"
    name: "imagenet1k-caption-joint-text-backbone-adapter"
    wandb_project: "unified-mm"
    output_dir: "output"
    save_every: 1202
    log_every: 50
    log_grad_norm_every: 1202
    checkpoints_total_limit: 10
    checkpoint_milestone_every: 1202
    save_ema_eval_every: 1202
    ema_eval_dtype: "bf16"
    save_image_flow_adapter: false
    save_final_image_flow_adapter: true
    save_hfmodel_every: 1000000000
    save_final: true
    val_every: 1202
    validation_image_every: 1202
    validation_seed: 424242
    validation_image_samples: 8
    validation_flow_temperature: 1.0
    validation_flow_cfg: 3.5
    validation_flow_cfg_schedule: "constant"
    validation_flow_solver: "heun"
    validation_flow_probe_times: [0.25, 0.5, 0.75, 0.95]
    validation_vae_dtype: "fp32"
    validation_save_debug_images: false
    validation_single_stream_images: true
    validation_single_stream_parallel_rate: 1
    validation_single_stream_order_strategies: ["spatial_halton"]
    validation_vae_module_root: "public/code/mar"
    validation_vae_path: "public/vae/mar-kl16/kl16.ckpt"
    validation_vae_scaling_factor: 0.2325
    resume_from_checkpoint: none

model:
    model_path: "public/models/Qwen--Qwen3-0.6B-Base"
    pretrained_image_flow_adapter: "output/selfless-flow-imagenet1k-class-ascend64-b1024-800ep/image_flow_adapter-final.pt"
    use_flex_attention: true
    image_tokens_per_img: 256
    image_latent_dim: 16
    backbone_attention_output_gate: "none"
    image_flow_depth: 8
    image_flow_width: 1280
    image_flow_num_sampling_steps: "100"
    image_flow_batch_mul: 4
    image_flow_time_scale: 1000.0
    image_flow_time_sampling: "logit_normal"
    image_flow_logit_mean: 0.0
    image_flow_logit_std: 1.0
    image_flow_time_eps: 1.0e-5
    image_flow_time_uniform_mix: 0.1
    image_flow_solver: "heun"
    image_input_noise_strength: 1.0e-2
    image_uncond_prob: 0.1
    # The fixed split-init probe measured median g_image/g_text=1.119 with
    # positive cosine on all 16 batches. Use the bounded 0.4 center so text is
    # not erased while the adapter aligns to the new backbone representation.
    lambda_text: 0.4
    lambda_image: 1.0

dataset:
    class_name: "ImageNetFlowCacheDataset"
    params:
        cache_path: "public/datasets/imagenet_full/vae_posterior_mar_kl16/posterior_stats_imagenet1k_train_fp16.pt"
        manifest_jsonl: "public/datasets/imagenet_full/manifest.jsonl"
        conditioning_mode: "caption"
        caption_jsonl: "public/datasets/imagenet1k_synthetic_v1/captions/imagenet1k_train_7captions.jsonl"
        caption_manifest_sha256: "c74f17cd6f8f85e74ae23606a4f0c3cc3eb1d4979413c910b5a63b2b327f6c3b"
        synthetic_text_index_manifest: "public/datasets/imagenet1k_synthetic_v1/indexed/train/manifest.json"
        caption_list_key: "captions"
        caption_list_text_key: "text"
        caption_path_key: "path"
        caption_id_key: "id"
        caption_include_original: false
        caption_validation_index: 0
        t2i_prompt_validation_index: 0
        caption_sequence_modes: ["t2i", "i2t"]
        caption_t2i_prefix: "Generate an image matching this description:"
        caption_i2t_prefix: "Describe this image in one detailed caption:"
        cache_caption_tokens: false
        model_context_length: 32768
        image_tokens_per_img: 256
        image_latent_dim: 16
        max_seq_length: 512
        pad_to_length: 512
        pad_to_multiple_of: 64
        split_strategy: "stratified"
        split_seed: 42
        val_samples_per_class: 50
        validation_overlap_train: false
    preprocessing:
        max_seq_length: 512

optimizer:
    name: "adamw"
    params:
        learning_rate: 2.0e-5
        # Conservative text-backbone update; the image adapter gets the larger
        # LR so it can align to Qwen text hidden states without erasing them.
        backbone_learning_rate: 2.0e-6
        projector_learning_rate: 2.0e-5
        flow_learning_rate: 2.0e-5
        special_token_learning_rate: 2.0e-6
        scale_lr: false
        beta1: 0.9
        beta2: 0.95
        weight_decay: 0.01
        flow_weight_decay: 0.01
        epsilon: 1.0e-8

lr_scheduler:
    scheduler: "wsd"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 1202
        decay_steps: 3606
        min_lr_scale: 0.1

training:
    batch_size: 16
    total_batch_size: 1024
    mixed_precision: "bf16"
    gradient_accumulation_dtype: "fp32"
    seed: 42
    dataloader_shuffle_seed: 42
    dataloader_workers: 0
    samples_per_epoch: 1230848
    optimizer_steps_per_epoch: 1202
    num_train_epochs: 10
    max_train_steps: 12020
    stop_after_steps: 2404
    max_grad_norm: 1.0
    use_gradient_checkpointing: false
    step_scheduler_with_optimizer: false
    from_scratch: false
    trainable_scope: "full"
    use_ema: true
    ema_decay: 0.999
    ema_update_after_step: 0
    ema_shard_chunk_numel: 4194304
    ema_validate: false
    ema_save_adapter: true
    ema_save_hf_model: true
    save_image_flow_adapter: true

evaluation:
    checkpoint: "output/selfless-flow-imagenet1k-caption-joint-text-backbone-adapter/hf_model-final-ema"
    model_dtype: "bf16"
    samples: 5000
    batch_size: 4096
    batch_size_per_npu: 256
    vae_decode_batch_size: 16
    sampling_steps: 100
    temperature: 1.0
    cfg: 3.5
    cfg_schedule: "constant"
    flow_solver: "heun"
    parallel_rate: 1
    strategies: "spatial_halton"
    seed: 42
    inception_weights_path: "public/models/torch-fidelity/weights-inception-2015-12-05-6726825d.pth"
    real_stats_path: "public/datasets/imagenet_full/fid_stats/inception_v3_2048_imagenet_val50000_256.pt"
