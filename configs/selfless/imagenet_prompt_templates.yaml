global_contexts:
  - "Use a normal camera viewpoint with realistic light, shadows, and depth. The image should contain enough surrounding detail to feel like a real photograph, but the subject should remain the part that a viewer notices first. Let the background include ordinary visual evidence such as surfaces, foliage, furniture, pavement, water, shelves, sky, or nearby objects when they fit the scene. Keep small contextual details visible around the subject."
  - "The scene should avoid looking like a studio icon, catalog cutout, or flat diagram. Include natural background cues, ordinary imperfections, and a sense of scale so the subject feels physically present. A viewer should be able to describe not only the class name, but also where the subject is, how it is lit, and what visual details make it recognizable. Keep small contextual details visible around the subject."
  - "Make the subject recognizable through its shape, material, surface texture, color, and relation to nearby objects or environment. The picture should feel like something someone might casually photograph with a real camera. It can include mild clutter, uneven lighting, partial background detail, and natural perspective, as long as the main subject remains clear. Keep small contextual details visible around the subject."
  - "Keep the composition coherent and grounded in the real world. The subject can be centered or off-center, close or moderately distant, as long as the important visual evidence remains visible. The image should have enough context to support the label without becoming a busy scene where the subject is hard to find. Keep small contextual details visible around the subject."
  - "The image should include realistic context rather than empty background: a surface, habitat, room, street, table, landscape, or other details that make the subject's identity easier to understand. Let the scene have depth and a plausible relationship between the subject and its surroundings, like a normal photograph from everyday life. Keep small contextual details visible around the subject."
  - "Aim for a natural photograph with believable perspective and local detail. The subject should not be confused with a neighboring category, and the surrounding scene should support the label instead of distracting from it. If the class has distinctive parts, textures, markings, or usage context, make those visible in a natural way. Keep small contextual details visible around the subject."
  - "Use enough visual context that the image could be described in a sentence without relying only on the class name. The subject should feel connected to a real place, object arrangement, habitat, or activity. Avoid making the picture too clean or symbolic; small environmental details often make the image feel more genuine. Keep small contextual details visible around the subject."

fallback_templates:
  - "Please show a natural, ordinary photograph of {class_name}. The subject should be visible enough to recognize, with believable lighting, surrounding context, and the kind of small imperfections that make an image feel like it came from the real world {image}"
  - "{image} This looks like {class_name}. The scene feels like a normal photograph, with the main subject present in a realistic setting rather than isolated as a symbol or drawn as an illustration."
  - "A realistic view of {class_name} would show its familiar shape, surface texture, scale, and everyday context {image} The final picture should feel like something a person could plausibly photograph."
  - "Please create a clear but natural image of {class_name}, keeping the subject recognizable while allowing realistic background detail, perspective, and lighting variation {image}"
  - "{image} In this image, the most natural short description is {class_name}. The object or scene is visible enough that the label feels grounded in the photograph."
  - "I want an image that someone would comfortably describe as {class_name}. It should not look like a diagram or icon; it should look like a normal photo with useful context {image}"

