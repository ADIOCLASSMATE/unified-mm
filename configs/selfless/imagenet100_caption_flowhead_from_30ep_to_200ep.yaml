# Stage 2: initialize from the 30-epoch joint-training EMA checkpoint, freeze
# the complete Qwen/image-input backbone, and optimize only the flow head and
# its condition projection for 170 additional epochs (200 total).
experiment:
    project: "selfless-flow-base-imagenet100-caption-30ep-flowhead-to200ep"
    name: "pure2d-caption-imagenet100-flowhead-only-30to200ep-8xh100-b256"
    wandb_project: "unified-mm"
    output_dir: "output"
    save_every: 8980                 # 20 stage-2 epochs
    log_every: 10
    log_grad_norm_every: 449         # 1 stage-2 epoch
    checkpoints_total_limit: 9       # save utility then retains the last 8
    save_hfmodel_every: 1000000000
    save_final: true
    val_every: 4490                  # 10 stage-2 epochs
    validation_image_every: 4490
    validation_seed: 424242
    validation_image_samples: 8
    validation_flow_temperature: 1.0
    validation_flow_cfg: 3.5
    validation_flow_cfg_schedule: "constant"
    validation_flow_solver: "heun"
    validation_flow_probe_times: [0.25, 0.5, 0.75, 0.95]
    validation_vae_dtype: "fp32"
    validation_save_debug_images: false
    validation_single_stream_images: true
    validation_single_stream_parallel_rate: 1
    validation_single_stream_order_strategies: ["spatial_halton"]
    validation_vae_module_root: "/inspire/hdd/global_user/wanjiaxin-253108030048/code/mar"
    validation_vae_path: "public/vae/mar-kl16/kl16.ckpt"
    validation_vae_scaling_factor: 0.2325
    resume_from_checkpoint: none

model:
    model_path: "output/selfless-flow-base-imagenet100-caption-40ep-wsd/hf_model-13470-ema"
    use_flex_attention: true
    image_tokens_per_img: 256
    image_latent_dim: 16
    backbone_attention_output_gate: "none"
    image_flow_depth: 8
    image_flow_width: 1280
    image_flow_num_sampling_steps: "10"
    image_flow_batch_mul: 4
    image_flow_time_scale: 1000.0
    image_flow_time_sampling: "logit_normal"
    image_flow_logit_mean: 0.0
    image_flow_logit_std: 1.0
    image_flow_time_eps: 1.0e-5
    image_flow_time_uniform_mix: 0.1
    image_flow_solver: "heun"
    image_input_noise_strength: 1.0e-2
    image_uncond_prob: 0.1
    pretrained_image_flow_adapter: none

dataset:
    class_name: "ImageNetFlowCacheDataset"
    params:
        cache_path: "public/datasets/imagenet_ablation_100c_balanced/vae_posterior_mar_kl16/posterior_stats_100c_1250pc_fp16.pt"
        manifest_jsonl: "public/datasets/imagenet_ablation_100c_balanced/manifest.jsonl"
        split_manifest_jsonl: "public/datasets/imagenet_ablation_100c_balanced/split_seed42_val100.jsonl"
        conditioning_mode: "caption"
        caption_jsonl: "public/datasets/imagenet_ablation_100c_balanced/captions/imagenet100_recaption_short_join.jsonl"
        caption_text_key: "recaption_short"
        caption_path_key: "path"
        caption_id_key: "id"
        caption_manifest_sha256: "85941ade4a64c88200f2223645317b8f504bb604a54211a08a4556737c50903f"
        cache_caption_tokens: false
        model_context_length: 32768
        image_tokens_per_img: 256
        image_latent_dim: 16
        max_seq_length: null
        pad_to_length: null
        pad_to_multiple_of: null
        packing:
            enabled: true
            algorithm: "deterministic_best_fit_decreasing"
            nominal_capacity: 2048
            overflow_policy: "dedicated_next_power_of_two"
            audit_manifests: false
    preprocessing:
        max_seq_length: 2048

optimizer:
    name: "adamw"
    params:
        learning_rate: 3.0e-5
        backbone_learning_rate: 0.0
        projector_learning_rate: 1.0e-5
        flow_learning_rate: 3.0e-5
        special_token_learning_rate: 0.0
        scale_lr: false
        beta1: 0.9
        beta2: 0.95
        weight_decay: 0.01
        flow_weight_decay: 0.01
        epsilon: 1.0e-8

lr_scheduler:
    scheduler: "wsd"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 449              # 1 stage-2 epoch
        decay_steps: 17960             # final 40 stage-2 epochs
        min_lr_scale: 0.1

training:
    batch_size: 32
    total_batch_size: 256
    mixed_precision: "bf16"
    gradient_accumulation_dtype: "fp32"
    seed: 42
    dataloader_shuffle_seed: 42
    dataloader_workers: 8
    dataloader_prefetch_factor: 4
    max_train_steps: 76330             # 170 * floor(115000 / 256)
    max_grad_norm: 1.0
    use_gradient_checkpointing: false
    step_scheduler_with_optimizer: false
    from_scratch: false
    trainable_scope: "image_flow_head"
    use_ema: true
    ema_decay: 0.999
    ema_update_after_step: 0
    ema_shard_chunk_numel: 4194304
    ema_validate: false
    ema_save_adapter: true
    ema_save_hf_model: true
    save_image_flow_adapter: true

evaluation:
    checkpoint: "output/selfless-flow-base-imagenet100-caption-30ep-flowhead-to200ep/hf_model-final-ema"
    model_dtype: "bf16"
    samples: 10000
    batch_size: 3072
    batch_size_per_h100: 384
    vae_decode_batch_size: 64
    sampling_steps: 10
    temperature: 1.0
    cfg: 3.5
    cfg_schedule: "constant"
    flow_solver: "heun"
    parallel_rate: 1
    strategies: "spatial_halton"
    seed: 42
    real_stats_path: "public/datasets/imagenet_ablation_100c_balanced/fid_stats/inception_v3_2048_original_256.pt"
