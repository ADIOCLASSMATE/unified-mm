experiment:
    project: "selfless-0.6B-multimodal"
    name: "selfless-phase1-unified"
    output_dir: "output"
    save_every: 100
    eval_every: 100
    generate_every: 10000
    log_every: 10
    log_grad_norm_every: 100
    checkpoints_total_limit: 200
    save_hfmodel_every: 10000
    val_every: 100
    resume_from_checkpoint: none

model:
    model_path: "public/models/Qwen/Qwen3-0.6B-Base"
    attention_pattern: "ar"
    loss_attention_pattern: "likelihood"
    mask_id: -1
    use_flex_attention: true
    unified_head: true
    image_vocab_size: 16384
    lambda_image: 0.5
    image_tokens_per_img: 512

dataset:
    class_name: "MultimodalDataset"
    params:
        jsonl_paths:
            - "public/datasets/coco/synthetic/train.jsonl"
            - "public/datasets/fineweb/phase1/train.jsonl"
        image_token_dir: "public/datasets/coco/image_tokens"
        max_seq_length: 2048
        image_tokens_per_img: 512
    preprocessing:
        max_seq_length: 2048

optimizer:
    name: adamw
    params:
        learning_rate: 2.0e-4
        scale_lr: false
        beta1: 0.8
        beta2: 0.95
        weight_decay: 0.1
        epsilon: 1e-8

lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 400
        decay_steps: 5000
        min_lr_scale: 0.01

training:
    batch_size: 4
    total_batch_size: 256
    mixed_precision: "bf16"
    enable_tf32: false
    seed: 42
    dataloader_workers: 4
    max_train_steps: 5000
    max_grad_norm: 1.0
    ar_ratio: -1.0
    mc_samples: 16
    use_gradient_checkpointing: true
    step_scheduler_with_optimizer: false
    from_scratch: false
