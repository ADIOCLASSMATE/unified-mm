# Ascend 910B production configuration for canonical ImageNet-100 training.
# B32 exhausted 60.96 GiB HBM in the production ZeRO-2 path.  Use the measured
# safe candidate: 16 samples/rank * 16 ranks * GA 2 = global batch 512.
experiment:
    project: "selfless-flow-im100-class-ascend16-b16ga2-b4e5-f1e4"
    name: "im100-class-80ep-seed42-16x910b-b16ga2-b512"
    wandb_project: "unified-mm"
    output_dir: "output"
    save_every: 4480
    log_every: 10
    log_grad_norm_every: 224
    checkpoints_total_limit: 2
    save_hfmodel_every: 1000000000
    save_final: true
    val_every: 2240
    validation_image_every: 2240
    validation_image_samples: 8
    validation_flow_temperature: 1.0
    validation_flow_cfg: 3.5
    validation_flow_cfg_schedule: "constant"
    validation_flow_solver: "heun"
    validation_flow_probe_times: [0.25, 0.5, 0.75, 0.95]
    validation_vae_dtype: "fp32"
    validation_save_debug_images: false
    validation_single_stream_images: true
    validation_single_stream_parallel_rate: 1
    validation_single_stream_order_strategies: ["spatial_halton"]
    validation_vae_module_root: "public/code/mar"
    validation_vae_path: "public/vae/mar-kl16/kl16.ckpt"
    validation_vae_scaling_factor: 0.2325
    resume_from_checkpoint: none

model:
    model_path: "public/models/Qwen--Qwen3-0.6B-Base"
    use_flex_attention: true
    image_tokens_per_img: 256
    image_latent_dim: 16
    backbone_attention_output_gate: "none"
    image_flow_depth: 8
    image_flow_width: 1280
    image_flow_num_sampling_steps: "100"
    image_flow_batch_mul: 4
    image_flow_time_scale: 1000.0
    image_flow_time_sampling: "logit_normal"
    image_flow_logit_mean: 0.0
    image_flow_logit_std: 1.0
    image_flow_time_eps: 1.0e-5
    image_flow_time_uniform_mix: 0.1
    image_flow_solver: "heun"
    image_input_noise_strength: 1.0e-2
    image_uncond_prob: 0.1
    pretrained_image_flow_adapter: none

dataset:
    class_name: "ImageNetFlowCacheDataset"
    params:
        cache_path: "public/datasets/imagenet_ablation_100c_balanced/vae_posterior_mar_kl16/posterior_stats_100c_1250pc_fp16.pt"
        manifest_jsonl: "public/datasets/imagenet_ablation_100c_balanced/manifest.jsonl"
        split_manifest_jsonl: "public/datasets/imagenet_ablation_100c_balanced/split_seed42_val100.jsonl"
        synset_mapping_path: "public/dataset/imagenet/v1/LOC_synset_mapping.txt"
        conditioning_mode: "class"
        image_tokens_per_img: 256
        image_latent_dim: 16
        max_seq_length: 320
        pad_to_length: 320
        pad_to_multiple_of: 64
    preprocessing:
        max_seq_length: 320

optimizer:
    name: "adamw"
    params:
        learning_rate: 1.0e-4
        backbone_learning_rate: 4.0e-5
        projector_learning_rate: 1.0e-4
        flow_learning_rate: 1.0e-4
        special_token_learning_rate: 4.0e-5
        scale_lr: false
        beta1: 0.9
        beta2: 0.95
        weight_decay: 0.01
        flow_weight_decay: 0.01
        epsilon: 1.0e-8

lr_scheduler:
    scheduler: "wsd"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 1000
        decay_steps: 4480
        min_lr_scale: 0.1

training:
    batch_size: 16
    total_batch_size: 512
    mixed_precision: "bf16"
    gradient_accumulation_dtype: "fp32"
    seed: 42
    dataloader_shuffle_seed: 42
    # Keep collation in each rank process. With 16 ranks, eight workers per
    # rank fan out to 128 children and can starve the instance health service.
    # The loader deliberately omits prefetch_factor when this value is zero.
    dataloader_workers: 0
    # Draw a new deterministic, no-replacement subset each epoch.  The budget
    # is exactly 224 global batches, so every rank sees 448 microbatches and
    # GA=2 never flushes a partial optimizer step at a DataLoader boundary.
    samples_per_epoch: 114688
    optimizer_steps_per_epoch: 224
    num_train_epochs: 80
    max_train_steps: 17920
    max_grad_norm: 1.0
    use_gradient_checkpointing: false
    step_scheduler_with_optimizer: false
    from_scratch: false
    use_ema: true
    ema_decay: 0.999
    ema_update_after_step: 0
    ema_shard_chunk_numel: 4194304
    ema_validate: false
    ema_save_adapter: true
    ema_save_hf_model: true
    save_image_flow_adapter: true

evaluation:
    checkpoint: "output/selfless-flow-im100-class-ascend16-b16ga2-b4e5-f1e4/hf_model-final-ema"
    model_dtype: "bf16"
    samples: 10000
    batch_size: 256
    batch_size_per_npu: 16
    vae_decode_batch_size: 16
    sampling_steps: 100
    temperature: 1.0
    cfg: 3.5
    cfg_schedule: "constant"
    flow_solver: "heun"
    parallel_rate: 1
    strategies: "spatial_halton"
    seed: 42
    real_stats_path: "public/datasets/imagenet_ablation_100c_balanced/fid_stats/inception_v3_2048_original_256.pt"
