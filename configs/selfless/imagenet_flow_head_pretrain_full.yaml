experiment:
    project: "pure-flow-head-imagenet-full"
    name: "pure-flow-head-imagenet-full"
    wandb_project: "unified-mm"
    log_with: "wandb"
    output_dir: "output"
    log_every: 10
    save_every: 1000
    val_every: 1000
    validation_batches: 16
    validation_image_every: 1000
    validation_image_samples: 4
    validation_flow_steps: 50
    validation_flow_temperature: 1.0
    validation_flow_sample_method: "heun"
    validation_denoise_t: 0.5
    validation_mar_root: "/inspire/hdd/global_user/wanjiaxin-253108030048/code/mar"
    validation_vae_path: "public/vae/mar-kl16/kl16.ckpt"
    validation_vae_scaling_factor: 0.2325
    resume_from_checkpoint: none

model:
    hidden_size: 1024
    image_tokens_per_img: 256
    image_latent_dim: 16
    flow_depth: 3
    flow_width: 1024
    flow_time_scale: 1000.0
    flow_sample_method: "heun"
    freeze_condition: true
    pretrained_flow_head: null

dataset:
    class_name: "ImageLatentFlowDataset"
    params:
        docs_jsonl: null
        latent_dir: "public/datasets/imagenet_full/vae_latents_mar_kl16"
        image_tokens_per_img: 256
        image_latent_dim: 16
        latent_key: "latent"
        deduplicate_image_ids: true
        max_samples: -1
        val_ratio: 0.001
        cache_path: "public/datasets/imagenet_full/vae_latents_mar_kl16/flow_latents_all_fp16.pt"
        cache_mode: "auto"
        cache_dtype: "float16"
        cache_mmap: true
        return_dtype: "float16"

optimizer:
    name: adamw
    params:
        learning_rate: 3.0e-4
        beta1: 0.9
        beta2: 0.95
        weight_decay: 0.01
        epsilon: 1e-8

lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 1000
        decay_steps: 35000
        min_lr_scale: 0.05

training:
    batch_size: 2048
    total_batch_size: 8192
    mixed_precision: "bf16"
    enable_tf32: true
    seed: 42
    dataloader_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
    max_train_steps: 50000
    max_grad_norm: 1.0
    step_scheduler_with_optimizer: false
