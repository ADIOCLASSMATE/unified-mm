experiment:
    project: "selfless-flow-0.6B-imagenet-warmup-full"
    name: "imagenet-flow-warmup-full"
    wandb_project: "unified-mm"
    output_dir: "output"
    save_every: 1000
    eval_every: 100
    generate_every: 10000
    log_every: 10
    log_grad_norm_every: 100
    checkpoints_total_limit: 200
    save_hfmodel_every: 10000
    val_every: 1000
    validation_image_every: 1000
    validation_image_samples: 4
    validation_flow_steps: 50
    validation_flow_temperature: 1.0
    validation_flow_sample_method: "heun"
    validation_single_stream_images: true
    validation_single_stream_parallel_rate: 1
    validation_mar_root: "/inspire/hdd/global_user/wanjiaxin-253108030048/code/mar"
    validation_vae_path: "public/vae/mar-kl16/kl16.ckpt"
    validation_vae_scaling_factor: 0.2325
    resume_from_checkpoint: none

model:
    model_path: "public/models/Qwen/Qwen3-0.6B-Base"
    attention_pattern: "ar"
    loss_attention_pattern: "likelihood"
    mask_id: -1
    use_flex_attention: true
    lambda_text: 0.0
    lambda_image: 1.0
    continuous_image_latents: true
    image_tokens_per_img: 256
    image_latent_dim: 16
    flow_depth: 3
    flow_width: 1024
    flow_time_scale: 1000.0
    flow_sample_method: "heun"
    pretrained_image_flow_adapter: none

dataset:
    class_name: "ImageNetFlowCacheDataset"
    params:
        cache_path: "public/datasets/imagenet_full/vae_latents_mar_kl16/flow_latents_all_fp16.pt"
        manifest_jsonl: "public/datasets/imagenet_full/manifest.jsonl"
        prompt_template: ""
        image_tokens_per_img: 256
        image_latent_dim: 16
        val_ratio: 0.001
    preprocessing:
        max_seq_length: 320

optimizer:
    name: adamw
    params:
        learning_rate: 1.0e-4
        backbone_learning_rate: 0.0
        projector_learning_rate: 1.0e-4
        flow_learning_rate: 1.0e-4
        special_token_learning_rate: 5.0e-5
        scale_lr: false
        beta1: 0.9
        beta2: 0.95
        weight_decay: 0.01
        epsilon: 1e-8

lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 1000
        decay_steps: 30000
        min_lr_scale: 0.05

training:
    batch_size: 128
    total_batch_size: 512
    mixed_precision: "bf16"
    enable_tf32: true
    seed: 42
    dataloader_workers: 4
    max_train_steps: 50000
    max_grad_norm: 1.0
    ar_ratio: -1.0
    mc_samples: 16
    use_gradient_checkpointing: false
    step_scheduler_with_optimizer: false
    from_scratch: false
    freeze_backbone_for_image_flow_warmup: true
    save_image_flow_adapter: true
