experiment:
    project: "selfless-diffusion-0.6B-imagenet-refine-full"
    name: "imagenet-diffusion-refine-full"
    wandb_project: "unified-mm"
    output_dir: "output"
    save_every: 1000
    eval_every: 100
    generate_every: 10000
    log_every: 10
    log_grad_norm_every: 100
    checkpoints_total_limit: 100
    save_hfmodel_every: 10000
    val_every: 1000
    validation_image_every: 1000
    validation_image_samples: 4
    validation_diffusion_temperature: 1.0
    validation_diffusion_cfg: 1.0
    validation_diffusion_clip_denoised: true
    validation_denoise_timestep: 500
    validation_vae_dtype: "fp32"
    validation_save_debug_images: false
    validation_single_stream_images: true
    validation_single_stream_parallel_rate: 1
    validation_single_stream_order_strategy: "sigma"
    validation_single_stream_order_strategies:
        - "sigma"
        - "causal_sigma"
        - "random"
        - "hidden_norm"
        - "latent_proj_cosine"
        - "spatial_halton"
    validation_mar_root: "/inspire/hdd/global_user/wanjiaxin-253108030048/code/mar"
    validation_vae_path: "public/vae/mar-kl16/kl16.ckpt"
    validation_vae_scaling_factor: 0.2325
    resume_from_checkpoint: none

model:
    model_path: "output/selfless-diffusion-0.6B-imagenet-unified-full/hf_model-final"
    attention_pattern: "ar"
    loss_attention_pattern: "likelihood"
    mask_id: -1
    use_flex_attention: true
    lambda_text: 0.0
    lambda_image: 1.0
    continuous_image_latents: true
    image_tokens_per_img: 256
    image_latent_dim: 16
    image_projector_width: 2048
    image_diffusion_depth: 8
    image_diffusion_width: 1280
    image_diffusion_num_sampling_steps: "100"
    image_diffusion_batch_mul: 4
    image_diffusion_condition_norm: "rms"
    image_diffusion_condition_norm_eps: 1.0e-6
    image_condition_drop_prob: 0.1
    pretrained_image_diffusion_adapter: "../mar/pretrained_models/mar/mar_large_hf/mar-large.safetensors"

dataset:
    class_name: "ImageNetFlowCacheDataset"
    params:
        cache_path: "public/datasets/imagenet_full/vae_latents_mar_kl16/flow_latents_all_fp16.pt"
        manifest_jsonl: "public/datasets/imagenet_full/manifest.jsonl"
        synset_mapping_path: "/inspire/dataset/imagenet/v1/LOC_synset_mapping.txt"
        prompt_templates_path: "configs/selfless/imagenet_prompt_templates.yaml"
        image_tokens_per_img: 256
        image_latent_dim: 16
        max_seq_length: 1024
        pad_to_multiple_of: 64
        val_ratio: 0.001
    preprocessing:
        max_seq_length: 1024

optimizer:
    name: adamw
    params:
        learning_rate: 1.0e-4
        backbone_learning_rate: 0.0
        projector_learning_rate: 1.0e-4
        diffusion_learning_rate: 2.0e-4
        special_token_learning_rate: 1.0e-5
        scale_lr: false
        beta1: 0.9
        beta2: 0.95
        weight_decay: 0.01
        epsilon: 1e-8

lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 1000
        decay_steps: 50000
        min_lr_scale: 0.1

training:
    batch_size: 64
    total_batch_size: 512
    mixed_precision: "bf16"
    enable_tf32: true
    seed: 42
    dataloader_workers: 4
    max_train_steps: 300000
    max_grad_norm: 1.0
    ar_ratio: -1.0
    mc_samples: 16
    use_gradient_checkpointing: false
    step_scheduler_with_optimizer: false
    from_scratch: false
    freeze_backbone_for_image_diffusion_refine: true
    save_image_diffusion_adapter: true
