# B_x0 flow-head depth scaling: 16 layers, width 1280.
# Unified baseline-B initialized from Qwen3-0.6B-Base.
#
# One optimizer update on 64 NPUs is frozen to four microbatches:
#   ClimbMix B4xL2048 -> ImageNet T2I B16xL512 ->
#   ClimbMix B4xL2048 -> ImageNet I2T B16xL512.
# The nominal supervised-text budget is
#   2 * 4 * 64 * (2048 - 1) = 1,048,064 targets/update;
# ceil(100B / 1,048,064) = 95,415 optimizer updates.
# This formal baseline starts from Qwen pretrained weights at step zero and
# runs the complete 100B nominal text-target horizon. Its historical LR winner
# is frozen here; no new 0.6B sweep or sweep-checkpoint resume is permitted.
experiment:
    identity:
        label: "B_x0 · flow depth 16"
        group: scaling
        purpose: formal
    project: "unified-b-x0content-flowdepth16-0p6b-100b-imagenet-split-s42-r1"
    name: "unified-b-x0content-flowdepth16-0p6b-100b-imagenet-split-s42-r1"
    wandb_project: "unified-mm"
    output_dir: "output"
    save_every: 2000
    log_every: 10
    log_grad_norm_every: 50
    debug_loss_trace_until_step: 0
    deepspeed_bf16_overflow_check_until_step: 0
    flow_stats_every: 50
    checkpoints_total_limit: 3
    # Keep three rolling checkpoints plus permanent 100-image-epoch milestones.
    checkpoint_milestone_every: 125100
    # Permanently export directly loadable current-model and EMA-model pairs
    # every 20 image epochs (pure-text controls use the same step interval).
    save_ema_eval_every: 25020
    save_model_with_ema_eval: true
    ema_eval_dtype: "bf16"
    save_image_flow_adapter: false
    save_final_image_flow_adapter: true
    save_hfmodel_every: 1000000000
    save_final: true
    save_final_checkpoint: true
    # Fixed global downstream probes; all training ranks participate.
    val_every: 10000
    downstream_validation:
        seed: 424242
        imagenet_per_class: 2
        grounding_samples: 512
        mc_samples: 16
        work_seconds: 540
        max_seconds: 600
    resume_from_checkpoint: none

model:
    model_path: "public/models/Qwen--Qwen3-0.6B-Base"
    architecture_variant: "selfless_contextual"
    training_objective: "selfless_dual_stream"
    dual_stream_attention_contract: "xlnet_content_diagonal"
    flow_head_attention_contract: "xlnet_content_diagonal"
    # Query AdaLN follows the strict XT/query stream. Content AdaLN follows
    # the backbone X0/content stream; old checkpoints without this field keep
    # their historical shared-query condition when loaded.
    flow_condition_contract: "backbone_xt_query_backbone_x0_content"
    # Persist the training order into every checkpoint. E overrides this to
    # sequential so evaluation cannot silently fall back to B's random order.
    training_image_sigma_order: "random"
    showo_mask_schedule: "cosine"
    showo_min_masking_rate: 0.0
    use_flex_attention: true
    image_tokens_per_img: 256
    image_latent_dim: 16
    backbone_attention_output_gate: "none"
    image_flow_depth: 16
    image_flow_grad_checkpointing: true
    image_flow_share_content: true
    image_flow_width: 1280
    image_flow_num_sampling_steps: "10"
    image_flow_batch_mul: 4
    # Globally off for every arm and overridden only by D's dedicated launcher.
    # D applies it inside the T2I Dynamic-XT branch, never to ClimbMix/I2T.
    dynamic_xt_t2i_gradient_checkpointing: false
    image_flow_time_scale: 1000.0
    image_flow_time_sampling: "logit_normal"
    image_flow_logit_mean: 0.0
    image_flow_logit_std: 1.0
    image_flow_time_eps: 1.0e-5
    image_flow_time_uniform_mix: 0.1
    image_flow_solver: "heun"
    image_input_noise_strength: 1.0e-2
    image_uncond_prob: 0.1
    lambda_text: 0.05
    lambda_image: 1.0
    pretrained_image_flow_adapter: none

dataset:
    class_name: "UnifiedMixedDataset"
    params:
        schedule: ["climbmix", "t2i", "climbmix", "i2t"]
        sources:
            climbmix:
                shard_glob: "public/ClimbMix/*.jsonl"
                tokenizer_path: "public/models/Qwen--Qwen3-0.6B-Base"
                sequence_length: 2048
                micro_batch_size: 4
                dataloader_workers: 1
                dataloader_prefetch_factor: 4
                tokenizer_batch_documents: 32
                max_document_chars: 32768
                rayon_num_threads: 2
            t2i:
                micro_batch_size: 16
                dataloader_workers: 2
                dataloader_prefetch_factor: 4
            i2t:
                micro_batch_size: 16
                dataloader_workers: 2
                dataloader_prefetch_factor: 4
        image:
            cache_path: "public/datasets/imagenet_full/vae_posterior_mar_kl16/posterior_stats_imagenet1k_train_fp16.pt"
            manifest_jsonl: "public/datasets/imagenet_full/manifest.jsonl"
            expected_split: "train"
            expected_records: 1281167
            conditioning_mode: "caption"
            caption_jsonl: "public/datasets/imagenet1k_synthetic_v1/captions/imagenet1k_train_7captions.jsonl"
            synthetic_text_index_manifest: "public/datasets/imagenet1k_synthetic_v1/indexed/train/manifest.json"
            caption_list_key: "captions"
            caption_list_text_key: "text"
            caption_path_key: "path"
            caption_id_key: "id"
            caption_include_original: false
            caption_validation_index: 0
            t2i_prompt_validation_index: 0
            caption_t2i_prefix: "Generate an image matching this description:"
            caption_i2t_prefix: "Describe this image in one detailed caption:"
            cache_caption_tokens: false
            model_context_length: 32768
            image_tokens_per_img: 256
            image_latent_dim: 16
            # B/C/D/F share random image reveal order. E overrides this to
            # deterministic serialized left-to-right order at launch time.
            image_sigma_order: "random"
            max_seq_length: 512
            pad_to_length: 512
            pad_to_multiple_of: 64
            # Validation is a completely separate cache/text/index dataset.
            # There is intentionally no train-overlap switch.
            validation:
                cache_path: "public/datasets/imagenet_full/vae_posterior_mar_kl16/posterior_stats_imagenet1k_val_fp16.pt"
                manifest_jsonl: "public/datasets/imagenet_full/manifest_val.jsonl"
                expected_split: "val"
                expected_records: 50000
                caption_jsonl: "public/datasets/imagenet1k_synthetic_v1/captions/imagenet1k_val_visual_descriptions.jsonl"
                synthetic_text_index_manifest: "public/datasets/imagenet1k_synthetic_v1/indexed/val/manifest.json"
    preprocessing:
        max_seq_length: 512

optimizer:
    name: "adamw"
    params:
        learning_rate: 3.0e-4
        backbone_learning_rate: 3.0e-4
        projector_learning_rate: 5.0e-5
        flow_learning_rate: 5.0e-5
        special_token_learning_rate: 3.0e-4
        scale_lr: false
        beta1: 0.9
        beta2: 0.95
        weight_decay: 0.01
        flow_weight_decay: 0.01
        epsilon: 1.0e-8

lr_scheduler:
    scheduler: "wsd"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 596
        decay_steps: 23854
        min_lr_scale: 0.1

training:
    # batch_size is the DeepSpeed maximum microbatch shape. Source-specific
    # logical batch sizes are frozen above.
    batch_size: 16
    total_batch_size: 2560
    gradient_accumulation_steps: 4
    mixed_precision: "bf16"
    gradient_accumulation_dtype: "fp32"
    seed: 42
    dataloader_shuffle_seed: 42
    dataloader_workers: 0
    runtime_hashing_enabled: false
    target_text_tokens: 100000000000
    nominal_text_targets_per_step_64npu: 1048064
    max_train_steps: 95415
    stop_after_steps: 95415
    max_grad_norm: 1.0
    use_gradient_checkpointing: false
    step_scheduler_with_optimizer: false
    from_scratch: false
    trainable_scope: "full"
    use_ema: true
    ema_decay: 0.9999
    ema_update_after_step: 0
    ema_shard_chunk_numel: 4194304
    ema_validate: true
    ema_save_adapter: true
    ema_save_hf_model: true
    save_image_flow_adapter: true

evaluation:
    checkpoint: "output/unified-b-x0content-flowdepth16-0p6b-100b-imagenet-split-s42-r1/hf_model-final-ema"
    model_dtype: "bf16"
    samples: 50000
    batch_size: 4096
    batch_size_per_npu: 256
    vae_decode_batch_size: 16
    sampling_steps: 10
    temperature: 1.0
    cfg: 3.5
    cfg_schedule: "constant"
    flow_solver: "heun"
    parallel_rate: 1
    strategies: "spatial_halton"
    seed: 42
    inception_weights_path: "public/models/torch-fidelity/weights-inception-2015-12-05-6726825d.pth"
    real_stats_path: "public/datasets/imagenet_full/fid_stats/inception_v3_2048_imagenet_val50000_256.pt"
