# Pure ImageNet image-to-text (caption) control for the 0.6B unified baseline.
#
# One combined-run I2T slot contributes 64 * 16 * 512 = 524,288 physical
# positions.  The fastest feasible 16-NPU shape found by full optimizer-step
# NPU smokes keeps the same total (the audited full-corpus maximum is 446):
#   16 * 32 * (2 * 512) = 524,288 positions/update.
# GA=1/B64 OOMed; GA=2/B32 was faster than the lower-padding GA=9 schedule.
# 190,736 updates consume exactly 100,000,595,968 physical positions.
experiment:
    project: "unified-b-0p6b-caption-only-100bphys-s42-r1"
    name: "unified-b-0p6b-caption-only-100bphys-s42-r1"
    wandb_project: "unified-mm"
    output_dir: "output"
    save_every: 2000
    log_every: 10
    log_grad_norm_every: 50
    flow_stats_every: 50
    checkpoints_total_limit: 3
    checkpoint_milestone_every: 0
    # Fixed paired current-model + EMA-model evaluation export interval.
    save_ema_eval_every: 12510
    save_model_with_ema_eval: true
    ema_eval_dtype: "bf16"
    save_image_flow_adapter: false
    save_final_image_flow_adapter: true
    save_hfmodel_every: 1000000000
    save_final: true
    save_final_checkpoint: true
    val_every: 2000
    validation_max_batches: 4
    validation_image_every: 2000
    validation_i2t_every: 2000
    validation_i2t_samples: 2
    validation_i2t_max_new_tokens: 64
    validation_i2t_temperature: 0.0
    validation_seed: 424242
    validation_image_samples: 2
    validation_flow_temperature: 1.0
    validation_flow_cfg: 3.5
    validation_flow_cfg_schedule: "constant"
    validation_flow_solver: "heun"
    validation_vae_dtype: "fp32"
    validation_single_stream_images: true
    validation_single_stream_parallel_rate: 1
    validation_single_stream_order_strategies: ["spatial_halton"]
    validation_vae_module_root: "public/code/mar"
    validation_vae_path: "public/vae/mar-kl16/kl16.ckpt"
    validation_vae_scaling_factor: 0.2325
    resume_from_checkpoint: none

model:
    model_path: "public/models/Qwen--Qwen3-0.6B-Base"
    architecture_variant: "selfless_contextual"
    training_objective: "selfless_dual_stream"
    dual_stream_attention_contract: "xlnet_content_diagonal"
    flow_head_attention_contract: "xlnet_content_diagonal"
    training_image_sigma_order: "random"
    showo_mask_schedule: "cosine"
    showo_min_masking_rate: 0.0
    use_flex_attention: true
    image_tokens_per_img: 256
    image_latent_dim: 16
    backbone_attention_output_gate: "none"
    image_flow_depth: 8
    image_flow_width: 1280
    image_flow_num_sampling_steps: "10"
    image_flow_batch_mul: 4
    dynamic_xt_t2i_gradient_checkpointing: false
    image_flow_time_scale: 1000.0
    image_flow_time_sampling: "logit_normal"
    image_flow_logit_mean: 0.0
    image_flow_logit_std: 1.0
    image_flow_time_eps: 1.0e-5
    image_flow_time_uniform_mix: 0.1
    image_flow_solver: "heun"
    image_input_noise_strength: 1.0e-2
    image_uncond_prob: 0.1
    lambda_text: 0.05
    lambda_image: 1.0
    pretrained_image_flow_adapter: none

dataset:
    class_name: "UnifiedMixedDataset"
    params:
        schedule: ["i2t", "i2t"]
        sources:
            i2t:
                micro_batch_size: 32
                dataloader_workers: 0
                pad_to_length_schedule: [512, 512]
                expected_global_physical_tokens_per_optimizer_step: 524288
        image:
            cache_path: "public/datasets/imagenet_full/vae_posterior_mar_kl16/posterior_stats_imagenet1k_train_fp16.pt"
            manifest_jsonl: "public/datasets/imagenet_full/manifest.jsonl"
            expected_split: "train"
            expected_records: 1281167
            conditioning_mode: "caption"
            caption_jsonl: "public/datasets/imagenet1k_synthetic_v1/captions/imagenet1k_train_7captions.jsonl"
            synthetic_text_index_manifest: "public/datasets/imagenet1k_synthetic_v1/indexed/train/manifest.json"
            caption_list_key: "captions"
            caption_list_text_key: "text"
            caption_path_key: "path"
            caption_id_key: "id"
            caption_include_original: false
            caption_validation_index: 0
            t2i_prompt_validation_index: 0
            caption_t2i_prefix: "Generate an image matching this description:"
            caption_i2t_prefix: "Describe this image in one detailed caption:"
            cache_caption_tokens: false
            model_context_length: 32768
            image_tokens_per_img: 256
            image_latent_dim: 16
            image_sigma_order: "random"
            max_seq_length: 512
            pad_to_length: 512
            pad_to_multiple_of: 64
            validation:
                cache_path: "public/datasets/imagenet_full/vae_posterior_mar_kl16/posterior_stats_imagenet1k_val_fp16.pt"
                manifest_jsonl: "public/datasets/imagenet_full/manifest_val.jsonl"
                expected_split: "val"
                expected_records: 50000
                caption_jsonl: "public/datasets/imagenet1k_synthetic_v1/captions/imagenet1k_val_visual_descriptions.jsonl"
                synthetic_text_index_manifest: "public/datasets/imagenet1k_synthetic_v1/indexed/val/manifest.json"
    preprocessing:
        max_seq_length: 512

optimizer:
    name: "adamw"
    params:
        learning_rate: 3.0e-4
        backbone_learning_rate: 3.0e-4
        projector_learning_rate: 5.0e-5
        flow_learning_rate: 5.0e-5
        special_token_learning_rate: 3.0e-4
        scale_lr: false
        beta1: 0.9
        beta2: 0.95
        weight_decay: 0.01
        flow_weight_decay: 0.01
        epsilon: 1.0e-8

lr_scheduler:
    scheduler: "wsd"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 1192
        decay_steps: 47684
        min_lr_scale: 0.1

training:
    batch_size: 32
    total_batch_size: 1024
    gradient_accumulation_steps: 2
    mixed_precision: "bf16"
    gradient_accumulation_dtype: "fp32"
    seed: 42
    dataloader_shuffle_seed: 42
    dataloader_workers: 0
    runtime_hashing_enabled: false
    target_physical_tokens: 100000595968
    physical_tokens_per_optimizer_step: 524288
    max_train_steps: 190736
    stop_after_steps: 190736
    max_grad_norm: 1.0
    use_gradient_checkpointing: false
    step_scheduler_with_optimizer: false
    from_scratch: false
    trainable_scope: "full"
    use_ema: true
    ema_decay: 0.9999
    ema_update_after_step: 0
    ema_shard_chunk_numel: 4194304
    ema_validate: false
    ema_save_adapter: true
    ema_save_hf_model: true
    save_image_flow_adapter: true

evaluation:
    checkpoint: "output/unified-b-0p6b-caption-only-100bphys-s42-r1/hf_model-final-ema"
    model_dtype: "bf16"
    samples: 50000
    batch_size: 4096
    batch_size_per_npu: 256
    vae_decode_batch_size: 16
    sampling_steps: 10
    temperature: 1.0
    cfg: 3.5
    cfg_schedule: "constant"
    flow_solver: "heun"
    parallel_rate: 1
    strategies: "spatial_halton"
    seed: 42
    inception_weights_path: "public/models/torch-fidelity/weights-inception-2015-12-05-6726825d.pth"
    real_stats_path: "public/datasets/imagenet_full/fid_stats/inception_v3_2048_imagenet_val50000_256.pt"
