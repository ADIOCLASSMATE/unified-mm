# B/X0 architecture at 512px; data/resolution qualification configuration.
# Keep the current 0.6B backbone to isolate data changes; select the intended
# large backbone separately after measuring memory and throughput.
# KL16: 32x32 positions, 1024 image tokens, 16 channels. Image context: 2048.
# Initial image microbatch 4 is NOT device-qualified. GA=4 and ClimbMix are unchanged.
# 64 ranks: 2*4 text + 2*4 image rows = 1024 rows/update;
# each image task sees 256 images/update (one quarter of historical B).
# Thus image-token exposure is equal, but unique-image exposure is NOT equal.
# Requires newly encoded 512px train/val caches and 512px FID reference moments.
# Stop at 955 for qualification; this file does not submit a training job.
experiment:
  project: unified-b-x0content-0p6b-images512-v1
  name: unified-b-x0content-0p6b-images512-v1
  wandb_project: unified-mm
  output_dir: output/unified-b-x0content-0p6b-images512-v1
  save_every: 2000
  log_every: 10
  log_grad_norm_every: 50
  debug_loss_trace_until_step: 0
  deepspeed_bf16_overflow_check_until_step: 0
  flow_stats_every: 50
  checkpoints_total_limit: 3
  checkpoint_milestone_every: 125100
  save_ema_eval_every: 25020
  save_model_with_ema_eval: true
  ema_eval_dtype: bf16
  save_image_flow_adapter: false
  save_final_image_flow_adapter: true
  save_hfmodel_every: 1000000000
  save_final: true
  save_final_checkpoint: true
  val_every: 2000
  validation_max_batches: 4
  validation_image_every: 2000
  validation_i2t_every: 2000
  validation_i2t_samples: 2
  validation_i2t_max_new_tokens: 64
  validation_i2t_temperature: 0.0
  validation_seed: 424242
  validation_image_samples: 2
  validation_flow_temperature: 1.0
  validation_flow_cfg: 3.5
  validation_flow_cfg_schedule: constant
  validation_flow_solver: heun
  validation_vae_dtype: fp32
  validation_single_stream_images: true
  validation_single_stream_parallel_rate: 1
  validation_single_stream_order_strategies:
  - spatial_halton
  validation_vae_module_root: public/code/mar
  validation_vae_path: public/vae/mar-kl16/kl16.ckpt
  validation_vae_scaling_factor: 0.2325
  resume_from_checkpoint: none
model:
  model_path: public/models/Qwen--Qwen3-0.6B-Base
  architecture_variant: selfless_contextual
  training_objective: selfless_dual_stream
  dual_stream_attention_contract: xlnet_content_diagonal
  flow_head_attention_contract: xlnet_content_diagonal
  flow_condition_contract: backbone_xt_query_backbone_x0_content
  training_image_sigma_order: random
  showo_mask_schedule: cosine
  showo_min_masking_rate: 0.0
  use_flex_attention: true
  image_tokens_per_img: 1024
  image_latent_dim: 16
  backbone_attention_output_gate: none
  image_flow_depth: 8
  image_flow_width: 1280
  image_flow_num_sampling_steps: '10'
  image_flow_batch_mul: 4
  dynamic_xt_t2i_gradient_checkpointing: false
  image_flow_time_scale: 1000.0
  image_flow_time_sampling: logit_normal
  image_flow_logit_mean: 0.0
  image_flow_logit_std: 1.0
  image_flow_time_eps: 1.0e-05
  image_flow_time_uniform_mix: 0.1
  image_flow_solver: heun
  image_input_noise_strength: 0.01
  image_uncond_prob: 0.1
  lambda_text: 0.05
  lambda_image: 1.0
  pretrained_image_flow_adapter: none
  image_flow_grad_checkpointing: true
  mask_token_id: 151669
  boi_token_id: 151670
  eoi_token_id: 151671
  image_mask_token_id: 151672
dataset:
  class_name: UnifiedMixedDataset
  params:
    schedule:
    - climbmix
    - t2i
    - climbmix
    - i2t
    sources:
      climbmix:
        shard_glob: public/ClimbMix/*.jsonl
        tokenizer_path: public/models/Qwen--Qwen3-0.6B-Base
        sequence_length: 2048
        micro_batch_size: 4
        dataloader_workers: 1
        dataloader_prefetch_factor: 4
        tokenizer_batch_documents: 32
        max_document_chars: 32768
        rayon_num_threads: 2
      t2i:
        micro_batch_size: 4
        dataloader_workers: 2
        dataloader_prefetch_factor: 4
      i2t:
        micro_batch_size: 4
        dataloader_workers: 2
        dataloader_prefetch_factor: 4
    image:
      cache_path: public/datasets/unified_image_text_512_sol_v1/releases/sol_100k_plus_corners_v1/posterior_index.json
      manifest_jsonl: public/datasets/unified_image_text_512_sol_v1/releases/sol_100k_plus_corners_v1/manifest.jsonl
      expected_split: train
      expected_records: 205755
      conditioning_mode: caption
      caption_jsonl: public/datasets/unified_image_text_512_sol_v1/releases/sol_100k_plus_corners_v1/captions.jsonl
      synthetic_text_index_manifest: public/datasets/unified_image_text_512_sol_v1/releases/sol_100k_plus_corners_v1/text_index.json
      caption_list_key: captions
      caption_list_text_key: text
      caption_path_key: path
      caption_id_key: id
      caption_include_original: false
      caption_validation_index: 0
      t2i_prompt_validation_index: 0
      caption_t2i_prefix: 'Generate an image matching this description:'
      caption_i2t_prefix: 'Describe this image in one detailed caption:'
      cache_caption_tokens: false
      model_context_length: 32768
      image_tokens_per_img: 1024
      image_latent_dim: 16
      image_sigma_order: random
      max_seq_length: 2048
      pad_to_length: 2048
      pad_to_multiple_of: 64
      validation:
        cache_path: public/datasets/unified_image_pool_512_v1/validation_imagenet512_v1/posterior_index.json
        manifest_jsonl: public/datasets/unified_image_pool_512_v1/validation_imagenet512_v1/manifest.jsonl
        expected_split: val
        expected_records: 50000
        caption_jsonl: public/datasets/imagenet1k_synthetic_v1/captions/imagenet1k_val_visual_descriptions.jsonl
        synthetic_text_index_manifest: public/datasets/imagenet1k_synthetic_v1/indexed/val/manifest.json
  preprocessing:
    max_seq_length: 2048
optimizer:
  name: adamw
  params:
    learning_rate: 0.0003
    backbone_learning_rate: 0.0003
    projector_learning_rate: 5.0e-05
    flow_learning_rate: 5.0e-05
    special_token_learning_rate: 0.0003
    scale_lr: false
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.01
    flow_weight_decay: 0.01
    epsilon: 1.0e-08
lr_scheduler:
  scheduler: wsd
  params:
    learning_rate: ${optimizer.params.learning_rate}
    warmup_steps: 596
    decay_steps: 23854
    min_lr_scale: 0.1
