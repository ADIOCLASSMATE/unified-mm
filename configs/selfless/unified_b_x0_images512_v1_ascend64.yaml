  model_dtype: bf16
  samples: 50000
  batch_size: 1024
  batch_size_per_npu: 16
  vae_decode_batch_size: 4
  sampling_steps: 10
  temperature: 1.0
  cfg: 3.5
  cfg_schedule: constant
  flow_solver: heun
  parallel_rate: 1
  strategies: spatial_halton
  seed: 42
  inception_weights_path: public/models/torch-fidelity/weights-inception-2015-12-05-6726825d.pth
  real_stats_path: public/datasets/unified_image_pool_512_v1/validation_imagenet512_v1/inception_v3_2048_val50000_512.pt
