experiment:
    project: "selfless-flow-0.6B-imagenet-unified-full"
    name: "imagenet-flow-unified-from-warmup-unfrozen-qwen"
    wandb_project: "unified-mm"
    output_dir: "output"
    save_every: 2000
    eval_every: 100
    generate_every: 10000
    log_every: 10
    log_grad_norm_every: 500
    checkpoints_total_limit: 40
    save_hfmodel_every: 10000
    val_every: 1000
    validation_image_every: 1000
    validation_image_samples: 4
    validation_flow_temperature: 1.0
    validation_flow_cfg: 1.5
    validation_flow_cfg_schedule: "linear"
    validation_flow_solver: "heun"
    validation_flow_probe_times: [0.25, 0.5, 0.75, 0.95]
    validation_vae_dtype: "fp32"
    validation_save_debug_images: false
    validation_single_stream_images: true
    validation_single_stream_parallel_rate: 1
    validation_single_stream_order_strategy: "sigma"
    validation_single_stream_order_strategies:
        - "random"
        - "spatial_halton"
    validation_mar_root: "/inspire/hdd/global_user/wanjiaxin-253108030048/code/mar"
    validation_vae_path: "public/vae/mar-kl16/kl16.ckpt"
    validation_vae_scaling_factor: 0.2325
    resume_from_checkpoint: none

model:
    model_path: "output/selfless-flow-0.6B-imagenet-warmup-from-mar-textft/hf_model-final"
    attention_pattern: "ar"
    loss_attention_pattern: "likelihood"
    mask_id: -1
    use_flex_attention: true
    lambda_text: 0.2
    lambda_image: 1.0
    continuous_image_latents: true
    image_tokens_per_img: 256
    image_latent_dim: 16
    image_projector_width: 2048
    image_generation_head_type: "flow"
    image_flow_depth: 8
    image_flow_width: 1280
    image_flow_num_sampling_steps: "100"
    image_flow_batch_mul: 4
    image_flow_condition_norm: "rms"
    image_flow_condition_norm_eps: 1.0e-6
    image_flow_time_scale: 1000.0
    image_flow_time_sampling: "logit_normal"
    image_flow_logit_mean: 0.0
    image_flow_logit_std: 1.0
    image_flow_time_eps: 1.0e-5
    image_flow_time_uniform_mix: 0.1
    image_flow_solver: "heun"
    image_uncond_prob: 0.1
    pretrained_image_flow_adapter: none

dataset:
    class_name: "CombinedImageNetTextFlowDataset"
    params:
        text_batch_ratio: 0.15
        batch_schedule: "accumulation"
        accumulation_steps: "auto"
        text_batches_per_accumulation: "ratio"
        val_text_batches: 8
        image:
            cache_path: "public/datasets/imagenet_full/vae_latents_mar_kl16/flow_latents_all_fp16.pt"
            manifest_jsonl: "public/datasets/imagenet_full/manifest.jsonl"
            synset_mapping_path: "public/datasets/imagenet/LOC_synset_mapping.txt"
            conditioning_mode: "caption_image"
            caption_jsonl: "public/datasets/csfm-imagenet1k-caption/train.jsonl"
            caption_sequence_modes:
                - "t2i"
                - "i2t"
            caption_t2i_prefixes:
                - "Generate an image matching this caption:"
                - "Create an image described by this caption:"
                - "Draw a realistic image for this caption:"
                - "Produce an image that follows this description:"
                - "Render the scene described here:"
                - "Create a visual scene from this caption:"
                - "Generate a picture based on this description:"
                - "Make an image that matches the following caption:"
                - "Turn this caption into an image:"
                - "Synthesize an image for this visual description:"
            caption_i2t_prefixes:
                - "Describe this image in one detailed caption."
                - "Write a detailed caption for this image."
                - "Summarize the visual content of this image."
                - "Provide a natural-language caption for this image."
                - "Describe the main subject, setting, and visible details."
                - "Write one caption that explains what is visible in this image."
                - "Describe this picture clearly and naturally."
                - "Create a caption for the image shown here."
                - "State what this image shows in a detailed caption."
                - "Caption this image with the important visual details."
            latent_hflip_prob: 0.5
            image_tokens_per_img: 256
            image_latent_dim: 16
            max_seq_length: 512
            pad_to_length: 512
            pad_to_multiple_of: 64
            val_ratio: 0.001
        text:
            tokenized_path: "public/.cache/huggingface/datasets/fwb-arrow-eos"
            max_seq_length: 1024
            rows_per_shard: 48804
            pad_to_length: 1024
            pad_to_multiple_of: 64
            sigma_mode: "ar"
            val_ratio: 0.001
            max_val_samples: 1280
    preprocessing:
        max_seq_length: 1024

optimizer:
    name: adamw
    params:
        learning_rate: 1.0e-4
        backbone_learning_rate: 2.0e-5
        projector_learning_rate: 1.0e-4
        flow_learning_rate: 1.0e-4
        special_token_learning_rate: 2.0e-5
        scale_lr: false
        beta1: 0.9
        beta2: 0.95
        weight_decay: 0.01
        epsilon: 1e-8

lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 2000
        decay_steps: 20000
        min_lr_scale: 0.1

training:
    batch_size: 16
    total_batch_size: 512
    mixed_precision: "bf16"
    enable_tf32: true
    seed: 42
    dataloader_workers: 4
    max_train_steps: 200000
    max_grad_norm: 1.0
    ar_ratio: -1.0
    mc_samples: 16
    use_gradient_checkpointing: false
    step_scheduler_with_optimizer: false
    from_scratch: false
    freeze_backbone_for_image_flow_warmup: false
    use_ema: true
    ema_decay: 0.9999
    ema_update_after_step: 0
    ema_validate: false
    ema_save_adapter: false
    ema_save_hf_model: true
    save_image_flow_adapter: false
